- id: python-venv
  title:
    cs: Python virtuální prostředí
    en: Python virtual environment
  tags:
    cs:
    - python
    - venv
    - virtualenv
    - pip
    - prostředí
    en:
    - python
    - venv
    - virtualenv
    - pip
    - environment
  commands:
  - cmd: python3 -m venv .venv
    desc:
      cs: Vytvořit venv v adresáři .venv
      en: Create venv in .venv directory
  - cmd: source .venv/bin/activate
    desc:
      cs: Aktivovat venv
      en: Activate venv
  - cmd: deactivate
    desc:
      cs: Deaktivovat venv
      en: Deactivate venv
  - cmd: pip install requests
    desc:
      cs: Nainstalovat balíček
      en: Install package
  - cmd: pip install -r requirements.txt
    desc:
      cs: Nainstalovat ze souboru závislostí
      en: Install from requirements file
  - cmd: pip freeze > requirements.txt
    desc:
      cs: Uložit aktuální balíčky do souboru
      en: Save current packages to file
  - cmd: pip list --outdated
    desc:
      cs: Které balíčky jsou zastaralé
      en: Which packages are outdated
  - cmd: pip install --upgrade balicek
    desc:
      cs: Upgradovat balíček
      en: Upgrade package
- id: python-run
  title:
    cs: Python spouštění
    en: Running Python
  tags:
    cs:
    - python
    - spustit
    - http
    - server
    en:
    - python
    - run
    - http
    - server
  commands:
  - cmd: python3 skript.py
    desc:
      cs: Spustit skript
      en: Run script
  - cmd: python3 -m http.server 8080
    desc:
      cs: Jednoduchý HTTP server v aktuálním adresáři
      en: Simple HTTP server in current directory
  - cmd: python3 -m json.tool soubor.json
    desc:
      cs: Pretty-print JSON
      en: Pretty-print JSON
  - cmd: python3 -c 'print(2**10)'
    desc:
      cs: Spustit inline výraz
      en: Run inline expression
  - cmd: python3 -i skript.py
    desc:
      cs: Po skončení zůstat v REPL
      en: Stay in REPL after script
- id: node-npm
  title:
    cs: Node.js / npm
    en: Node.js / npm
  tags:
    cs:
    - node
    - npm
    - javascript
    - balíčky
    en:
    - node
    - npm
    - javascript
    - packages
  commands:
  - cmd: node --version
    desc:
      cs: Verze Node.js
      en: Node.js version
  - cmd: node app.js
    desc:
      cs: Spustit skript
      en: Run script
  - cmd: npm init -y
    desc:
      cs: Vytvořit package.json s výchozími hodnotami
      en: Create package.json with defaults
  - cmd: npm install express
    desc:
      cs: Nainstalovat balíček (do node_modules)
      en: Install package (into node_modules)
  - cmd: npm install -g pm2
    desc:
      cs: Globální instalace
      en: Global install
  - cmd: npm install
    desc:
      cs: Nainstalovat vše z package.json
      en: Install everything from package.json
  - cmd: npm update
    desc:
      cs: Aktualizovat balíčky
      en: Update packages
  - cmd: npm outdated
    desc:
      cs: Které balíčky jsou zastaralé
      en: Which packages are outdated
  - cmd: npm run dev
    desc:
      cs: Spustit script 'dev' z package.json
      en: Run 'dev' script from package.json
