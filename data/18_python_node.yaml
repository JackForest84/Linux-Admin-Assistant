- id: python-venv
  title_cs: "Python virtuální prostředí"
  title_en: "Python virtual environment"
  tags_cs: [python, venv, virtualenv, pip, prostředí]
  tags_en: [python, venv, virtualenv, pip, environment]
  commands:
    - cmd: "python3 -m venv .venv"
      desc_cs: "Vytvořit venv v adresáři .venv"
      desc_en: "Create venv in .venv directory"
    - cmd: "source .venv/bin/activate"
      desc_cs: "Aktivovat venv"
      desc_en: "Activate venv"
    - cmd: "deactivate"
      desc_cs: "Deaktivovat venv"
      desc_en: "Deactivate venv"
    - cmd: "pip install requests"
      desc_cs: "Nainstalovat balíček"
      desc_en: "Install package"
    - cmd: "pip install -r requirements.txt"
      desc_cs: "Nainstalovat ze souboru závislostí"
      desc_en: "Install from requirements file"
    - cmd: "pip freeze > requirements.txt"
      desc_cs: "Uložit aktuální balíčky do souboru"
      desc_en: "Save current packages to file"
    - cmd: "pip list --outdated"
      desc_cs: "Které balíčky jsou zastaralé"
      desc_en: "Which packages are outdated"
    - cmd: "pip install --upgrade balicek"
      desc_cs: "Upgradovat balíček"
      desc_en: "Upgrade package"

- id: python-run
  title_cs: "Python spouštění"
  title_en: "Running Python"
  tags_cs: [python, spustit, http, server]
  tags_en: [python, run, http, server]
  commands:
    - cmd: "python3 skript.py"
      desc_cs: "Spustit skript"
      desc_en: "Run script"
    - cmd: "python3 -m http.server 8080"
      desc_cs: "Jednoduchý HTTP server v aktuálním adresáři"
      desc_en: "Simple HTTP server in current directory"
    - cmd: "python3 -m json.tool soubor.json"
      desc_cs: "Pretty-print JSON"
      desc_en: "Pretty-print JSON"
    - cmd: "python3 -c 'print(2**10)'"
      desc_cs: "Spustit inline výraz"
      desc_en: "Run inline expression"
    - cmd: "python3 -i skript.py"
      desc_cs: "Po skončení zůstat v REPL"
      desc_en: "Stay in REPL after script"

- id: node-npm
  title_cs: "Node.js / npm"
  title_en: "Node.js / npm"
  tags_cs: [node, npm, javascript, balíčky]
  tags_en: [node, npm, javascript, packages]
  commands:
    - cmd: "node --version"
      desc_cs: "Verze Node.js"
      desc_en: "Node.js version"
    - cmd: "node app.js"
      desc_cs: "Spustit skript"
      desc_en: "Run script"
    - cmd: "npm init -y"
      desc_cs: "Vytvořit package.json s výchozími hodnotami"
      desc_en: "Create package.json with defaults"
    - cmd: "npm install express"
      desc_cs: "Nainstalovat balíček (do node_modules)"
      desc_en: "Install package (into node_modules)"
    - cmd: "npm install -g pm2"
      desc_cs: "Globální instalace"
      desc_en: "Global install"
    - cmd: "npm install"
      desc_cs: "Nainstalovat vše z package.json"
      desc_en: "Install everything from package.json"
    - cmd: "npm update"
      desc_cs: "Aktualizovat balíčky"
      desc_en: "Update packages"
    - cmd: "npm outdated"
      desc_cs: "Které balíčky jsou zastaralé"
      desc_en: "Which packages are outdated"
    - cmd: "npm run dev"
      desc_cs: "Spustit script 'dev' z package.json"
      desc_en: "Run 'dev' script from package.json"
