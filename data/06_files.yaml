- id: file-find
  title:
    cs: Najít soubor
    en: Find file
  tags:
    cs:
    - find
    - najít
    - hledat
    - soubor
    en:
    - find
    - search
    - file
  commands:
  - cmd: find /etc -name '*.conf'
    desc:
      cs: Najít všechny .conf soubory v /etc
      en: Find all .conf files in /etc
  - cmd: find . -type f -mtime -1
    desc:
      cs: Soubory změněné za posledních 24 h
      en: Files modified in last 24 h
  - cmd: find / -type f -size +1G 2>/dev/null
    desc:
      cs: Soubory větší než 1 GB
      en: Files larger than 1 GB
  - cmd: locate nginx.conf
    desc:
      cs: Rychlé hledání přes databázi (sudo updatedb)
      en: Fast search via database (sudo updatedb)
- id: file-grep
  title:
    cs: Hledat text v souborech
    en: Search text in files
  tags:
    cs:
    - grep
    - hledat
    - text
    - obsah
    - řetězec
    en:
    - grep
    - search
    - text
    - content
    - string
  commands:
  - cmd: grep -r 'heslo' /etc
    desc:
      cs: Rekurzivně hledat řetězec ve všech souborech
      en: Recursively search string in all files
  - cmd: grep -rn 'error' /var/log
    desc:
      cs: Včetně čísel řádků
      en: Including line numbers
  - cmd: grep -ri 'TODO' . --include='*.py'
    desc:
      cs: Bez ohledu na velikost, jen v .py souborech
      en: Case-insensitive, only in .py files
  - cmd: grep -v '^#' /etc/ssh/sshd_config | grep -v '^$'
    desc:
      cs: Bez komentářů a prázdných řádků
      en: Without comments and empty lines
- id: file-perms
  title:
    cs: Práva souborů a vlastník
    en: File permissions and owner
  tags:
    cs:
    - chmod
    - chown
    - práva
    - vlastník
    - permissions
    en:
    - chmod
    - chown
    - permissions
    - owner
  commands:
  - cmd: ls -l soubor
    desc:
      cs: Zobrazit práva, vlastníka, velikost
      en: Show permissions, owner, size
  - cmd: chmod 644 soubor
    desc:
      cs: rw-r--r-- (běžný soubor)
      en: rw-r--r-- (regular file)
  - cmd: chmod 755 skript.sh
    desc:
      cs: rwxr-xr-x (spustitelný)
      en: rwxr-xr-x (executable)
  - cmd: chmod +x skript.sh
    desc:
      cs: Přidat právo spouštění
      en: Add execute permission
  - cmd: sudo chown jakub:jakub /opt/aplikace -R
    desc:
      cs: Změnit vlastníka rekurzivně
      en: Change owner recursively
- id: file-copy
  title:
    cs: Kopírovat / přesunout soubory
    en: Copy / move files
  tags:
    cs:
    - cp
    - mv
    - kopírovat
    - přesunout
    - rsync
    en:
    - cp
    - mv
    - copy
    - move
    - rsync
  commands:
  - cmd: cp -r src/ dest/
    desc:
      cs: Rekurzivně zkopírovat složku
      en: Recursively copy folder
  - cmd: cp -a src/ dest/
    desc:
      cs: Zachovat práva a časy
      en: Preserve permissions and timestamps
  - cmd: mv soubor.txt /tmp/
    desc:
      cs: Přesunout (nebo přejmenovat)
      en: Move (or rename)
  - cmd: rsync -avh --progress src/ dest/
    desc:
      cs: Rychlá synchronizace s progress barem
      en: Fast sync with progress
  - cmd: rsync -avzh src/ user@host:/path/
    desc:
      cs: Sync na vzdálený server přes SSH
      en: Sync to remote server via SSH
- id: file-archive
  title:
    cs: Archivy (tar, zip)
    en: Archives (tar, zip)
  tags:
    cs:
    - tar
    - zip
    - archiv
    - komprese
    - gzip
    - rozbalit
    en:
    - tar
    - zip
    - archive
    - compress
    - gzip
    - extract
  commands:
  - cmd: tar czf archiv.tar.gz slozka/
    desc:
      cs: Vytvořit gzip archiv ze složky
      en: Create gzip archive from folder
  - cmd: tar xzf archiv.tar.gz
    desc:
      cs: Rozbalit gzip archiv
      en: Extract gzip archive
  - cmd: tar tzf archiv.tar.gz
    desc:
      cs: Vypsat obsah archivu (bez rozbalení)
      en: List archive contents (without extracting)
  - cmd: zip -r archiv.zip slozka/
    desc:
      cs: Vytvořit ZIP
      en: Create ZIP
  - cmd: unzip archiv.zip
    desc:
      cs: Rozbalit ZIP
      en: Extract ZIP
