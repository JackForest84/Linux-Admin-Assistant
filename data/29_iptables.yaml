- id: iptables-list
  title:
    cs: iptables - výpis pravidel
    en: iptables - list rules
  tags:
    cs:
    - iptables
    - firewall
    - pravidla
    - list
    en:
    - iptables
    - firewall
    - rules
    - list
  commands:
  - cmd: sudo iptables -L -n -v
    desc:
      cs: Vypsat všechna pravidla
      en: List all rules
  - cmd: sudo iptables -L -n -v --line-numbers
    desc:
      cs: Vč. čísel řádků (pro mazání)
      en: Including line numbers (for deletion)
  - cmd: sudo iptables -S
    desc:
      cs: Pravidla ve formátu příkazů
      en: Rules in command format
  - cmd: sudo iptables-save > rules.v4
    desc:
      cs: Uložit pravidla do souboru
      en: Save rules to file
  - cmd: sudo iptables-restore < rules.v4
    desc:
      cs: Obnovit pravidla ze souboru
      en: Restore rules from file
- id: iptables-rules
  title:
    cs: iptables - přidat / smazat pravidla
    en: iptables - add / delete rules
  tags:
    cs:
    - iptables
    - povolit
    - zakázat
    - port
    - allow
    - drop
    en:
    - iptables
    - allow
    - deny
    - port
    - drop
  commands:
  - cmd: sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT
    desc:
      cs: Povolit příchozí SSH
      en: Allow incoming SSH
  - cmd: sudo iptables -A INPUT -s 1.2.3.4 -j DROP
    desc:
      cs: Zablokovat IP adresu
      en: Block IP address
  - cmd: sudo iptables -D INPUT 3
    desc:
      cs: Smazat pravidlo č. 3
      en: 'Delete rule #3'
  - cmd: sudo iptables -F
    desc:
      cs: Smazat všechna pravidla (POZOR!)
      en: Flush all rules (CAREFUL!)
  - cmd: sudo iptables -P INPUT DROP
    desc:
      cs: 'Výchozí politika: vše blokovat'
      en: 'Default policy: drop everything'
- id: nftables
  title:
    cs: nftables (moderní náhrada iptables)
    en: nftables (modern iptables replacement)
  tags:
    cs:
    - nftables
    - nft
    - firewall
    - moderní
    en:
    - nftables
    - nft
    - firewall
    - modern
  commands:
  - cmd: sudo nft list ruleset
    desc:
      cs: Vypsat všechna pravidla
      en: List all rules
  - cmd: sudo nft list table inet filter
    desc:
      cs: Detail tabulky
      en: Table details
  - cmd: sudo nft -f /etc/nftables.conf
    desc:
      cs: Načíst konfiguraci ze souboru
      en: Load config from file
  - cmd: sudo nft flush ruleset
    desc:
      cs: Smazat všechna pravidla
      en: Flush all rules
