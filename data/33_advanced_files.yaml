    nl: [find, geavanceerd, exec]
    hu: [find, haladó, exec]
  commands:
    - cmd: "find . -name '*.log' -mtime +30 -delete"
      desc:
        en: "Delete .log files older than 30 days"
        cs: "Smazat .log soubory starší než 30 dní"
        sk: "Zmazať .log súbory staršie ako 30 dní"
        de: ".log-Dateien älter als 30 Tage löschen"
        es: "Eliminar .log de más de 30 días"
        fr: "Supprimer .log de plus de 30 jours"
        it: "Eliminare .log più vecchi di 30 giorni"
        pl: "Usuń pliki .log starsze niż 30 dni"
        tr: "30 günden eski .log dosyalarını sil"
        pt: "Excluir .log com mais de 30 dias"
        nl: ".log-bestanden ouder dan 30 dagen verwijderen"
        hu: "30 napnál régebbi .log fájlok törlése"
    - cmd: "find . -name '*.tmp' -exec rm {} +"
      desc:
        en: "Delete all .tmp (efficiently)"
        cs: "Smazat všechny .tmp (efektivně)"
        sk: "Zmazať všetky .tmp (efektívne)"
        de: "Alle .tmp löschen (effizient)"
        es: "Eliminar todos .tmp (eficiente)"
        fr: "Supprimer tous .tmp (efficacement)"
