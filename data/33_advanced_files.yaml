- id: find-advanced
  title:
    cs: find - pokročilé použití
    en: find - advanced usage
  tags:
    cs:
    - find
    - hledat
    - advanced
    - exec
    - pokročilé
    en:
    - find
    - advanced
    - exec
  commands:
  - cmd: find . -name '*.log' -mtime +30 -delete
    desc:
      cs: Smazat .log soubory starší než 30 dní
      en: Delete .log files older than 30 days
  - cmd: find . -name '*.tmp' -exec rm {} +
    desc:
      cs: Smazat všechny .tmp (efektivně)
      en: Delete all .tmp (efficiently)
  - cmd: find . -type f -exec grep -l 'TODO' {} +
    desc:
      cs: Najít soubory obsahující 'TODO'
      en: Find files containing 'TODO'
  - cmd: find . -type f -name '*.jpg' -exec cp {} /backup/ \;
    desc:
      cs: 'Pro každý JPG: kopírovat do /backup'
      en: 'For each JPG: copy to /backup'
  - cmd: find . -empty -type d
    desc:
      cs: Najít prázdné adresáře
      en: Find empty directories
  - cmd: find . -perm 777
    desc:
      cs: Soubory s konkrétními právy
      en: Files with specific permissions
  - cmd: find / -user pepa 2>/dev/null
    desc:
      cs: Soubory patřící uživateli
      en: Files owned by user
  - cmd: find . -newer reference.txt
    desc:
      cs: Soubory novější než reference.txt
      en: Files newer than reference.txt
- id: rename-batch
  title:
    cs: Hromadné přejmenování
    en: Batch renaming
  tags:
    cs:
    - rename
    - přejmenovat
    - hromadně
    - batch
    en:
    - rename
    - batch
    - mass
  commands:
  - cmd: rename 's/\.txt$/.md/' *.txt
    desc:
      cs: Přejmenovat všechny .txt na .md (Perl rename)
      en: Rename all .txt to .md (Perl rename)
  - cmd: for f in *.JPG; do mv "$f" "${f%.JPG}.jpg"; done
    desc:
      cs: Přejmenovat .JPG → .jpg (bash)
      en: Rename .JPG → .jpg (bash)
  - cmd: mmv 'foo_*' 'bar_#1'
    desc:
      cs: 'S mmv: foo_X → bar_X (apt install mmv)'
      en: 'Using mmv: foo_X → bar_X'
- id: file-meta
  title:
    cs: Metadata souborů
    en: File metadata
  tags:
    cs:
    - stat
    - file
    - metadata
    - typ
    - info
    en:
    - stat
    - file
    - metadata
    - type
    - info
  commands:
  - cmd: stat soubor.txt
    desc:
      cs: Detail souboru (časy, práva, inode)
      en: File details (times, perms, inode)
  - cmd: file soubor
    desc:
      cs: Jaký typ souboru je to
      en: What type of file is it
  - cmd: file -i soubor
    desc:
      cs: MIME typ
      en: MIME type
  - cmd: touch soubor
    desc:
      cs: Vytvořit prázdný soubor / aktualizovat čas
      en: Create empty file / update timestamp
  - cmd: touch -d '2025-01-01' soubor
    desc:
      cs: Nastavit konkrétní čas souboru
      en: Set specific file timestamp
- id: dd-loop
  title:
    cs: Loop soubory a virtuální disky
    en: Loop files and virtual disks
  tags:
    cs:
    - loop
    - image
    - virtuální
    - disk
    - losetup
    - qemu
    en:
    - loop
    - image
    - virtual
    - disk
    - losetup
    - qemu
  commands:
  - cmd: dd if=/dev/zero of=disk.img bs=1M count=100
    desc:
      cs: Vytvořit prázdný 100 MB image
      en: Create empty 100 MB image
  - cmd: sudo losetup -fP disk.img
    desc:
      cs: Připojit jako loop zařízení
      en: Attach as loop device
  - cmd: sudo losetup -a
    desc:
      cs: Seznam aktivních loop
      en: List active loops
  - cmd: sudo losetup -d /dev/loop0
    desc:
      cs: Odpojit loop
      en: Detach loop
  - cmd: sudo mount disk.img /mnt -o loop
    desc:
      cs: Mountovat image přímo
      en: Mount image directly
