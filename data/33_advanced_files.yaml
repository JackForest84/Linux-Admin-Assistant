        pl: "Usuń wszystkie .tmp (efektywnie)"
        tr: "Tüm .tmp'leri sil (verimli)"
        pt: "Excluir todos .tmp (eficiente)"
        nl: "Alle .tmp verwijderen (efficiënt)"
        hu: "Minden .tmp törlése (hatékonyan)"
    - cmd: "find . -type f -exec grep -l 'TODO' {} +"
      desc:
        en: "Find files containing 'TODO'"
        cs: "Najít soubory obsahující 'TODO'"
        sk: "Nájsť súbory obsahujúce 'TODO'"
        de: "Dateien finden, die 'TODO' enthalten"
        es: "Encontrar archivos con 'TODO'"
        fr: "Trouver les fichiers contenant 'TODO'"
        it: "Trovare file contenenti 'TODO'"
        pl: "Znajdź pliki zawierające 'TODO'"
        tr: "'TODO' içeren dosyaları bul"
        pt: "Encontrar arquivos com 'TODO'"
        nl: "Bestanden vinden met 'TODO'"
        hu: "'TODO'-t tartalmazó fájlok keresése"
    - cmd: "find . -type f -name '*.jpg' -exec cp {} /backup/ \\;"
      desc:
        en: "For each JPG: copy to /backup"
        cs: "Pro každý JPG: kopírovat do /backup"
        sk: "Pre každý JPG: kopírovať do /backup"
        de: "Für jede JPG: nach /backup kopieren"
        es: "Por cada JPG: copiar a /backup"
        fr: "Pour chaque JPG : copier dans /backup"
        it: "Per ogni JPG: copiare in /backup"
        pl: "Dla każdego JPG: kopiuj do /backup"
        tr: "Her JPG için: /backup'a kopyala"
        pt: "Para cada JPG: copiar para /backup"
        nl: "Voor elke JPG: kopiëren naar /backup"
        hu: "Minden JPG-hez: másolás /backup-ba"
    - cmd: "find . -empty -type d"
      desc:
        en: "Find empty directories"
        cs: "Najít prázdné adresáře"
        sk: "Nájsť prázdne adresáre"
        de: "Leere Verzeichnisse finden"
        es: "Encontrar directorios vacíos"
        fr: "Trouver les dossiers vides"
        it: "Trovare directory vuote"
        pl: "Znajdź puste katalogi"
        tr: "Boş dizinleri bul"
        pt: "Encontrar diretórios vazios"
        nl: "Lege mappen vinden"
        hu: "Üres könyvtárak keresése"
    - cmd: "find . -perm 777"
      desc:
        en: "Files with specific permissions"
        cs: "Soubory s konkrétními právy"
        sk: "Súbory s konkrétnymi právami"
        de: "Dateien mit bestimmten Rechten"
        es: "Archivos con permisos específicos"
        fr: "Fichiers avec permissions spécifiques"
        it: "File con permessi specifici"
        pl: "Pliki z konkretnymi uprawnieniami"
        tr: "Belirli izinli dosyalar"
        pt: "Arquivos com permissões específicas"
        nl: "Bestanden met specifieke rechten"
        hu: "Adott jogosultságú fájlok"
    - cmd: "find / -user pepa 2>/dev/null"
      desc:
        en: "Files owned by user"
        cs: "Soubory patřící uživateli"
        sk: "Súbory patriace používateľovi"
        de: "Dateien eines Benutzers"
        es: "Archivos del usuario"
        fr: "Fichiers d'un utilisateur"
        it: "File di un utente"
        pl: "Pliki użytkownika"
        tr: "Kullanıcıya ait dosyalar"
        pt: "Arquivos do usuário"
        nl: "Bestanden van gebruiker"
        hu: "Felhasználó fájljai"
    - cmd: "find . -newer reference.txt"
      desc:
        en: "Files newer than reference.txt"
        cs: "Soubory novější než reference.txt"
        sk: "Súbory novšie ako reference.txt"
        de: "Dateien neuer als reference.txt"
        es: "Archivos más nuevos que reference.txt"
        fr: "Fichiers plus récents que reference.txt"
        it: "File più nuovi di reference.txt"
        pl: "Pliki nowsze niż reference.txt"
