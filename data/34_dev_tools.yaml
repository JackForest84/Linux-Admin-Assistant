- id: make
  title:
    cs: make a build
    en: make and build
  tags:
    cs:
    - make
    - makefile
    - build
    - kompilace
    en:
    - make
    - makefile
    - build
    - compile
  commands:
  - cmd: make
    desc:
      cs: Spustit default target z Makefile
      en: Run default target from Makefile
  - cmd: make install
    desc:
      cs: Nainstalovat zkompilovaný program
      en: Install compiled program
  - cmd: make clean
    desc:
      cs: Smazat build artefakty
      en: Remove build artifacts
  - cmd: make -j$(nproc)
    desc:
      cs: Paralelní build (využije všechna jádra)
      en: Parallel build (use all cores)
  - cmd: ./configure && make && sudo make install
    desc:
      cs: Klasická trojice u zdrojákových balíčků
      en: Classic source build trio
- id: go-rust
  title:
    cs: Go a Rust
    en: Go and Rust
  tags:
    cs:
    - go
    - golang
    - rust
    - cargo
    - kompilace
    en:
    - go
    - golang
    - rust
    - cargo
    - compile
  commands:
  - cmd: go build
    desc:
      cs: Zkompilovat (vytvoří binárku)
      en: Compile (creates binary)
  - cmd: go run main.go
    desc:
      cs: Spustit bez vytvoření binárky
      en: Run without binary
  - cmd: go test ./...
    desc:
      cs: Spustit všechny testy v projektu
      en: Run all tests in project
  - cmd: go mod tidy
    desc:
      cs: Vyčistit závislosti
      en: Clean dependencies
  - cmd: cargo build --release
    desc:
      cs: 'Rust: kompilace s optimalizacemi'
      en: 'Rust: compile with optimizations'
  - cmd: cargo run
    desc:
      cs: 'Rust: build + spustit'
      en: 'Rust: build + run'
  - cmd: cargo test
    desc:
      cs: 'Rust: testy'
      en: 'Rust: tests'
- id: ansible-basics
  title:
    cs: Ansible základy
    en: Ansible basics
  tags:
    cs:
    - ansible
    - automatizace
    - playbook
    - ad-hoc
    en:
    - ansible
    - automation
    - playbook
    - ad-hoc
  commands:
  - cmd: ansible all -m ping
    desc:
      cs: Test spojení se všemi hosty
      en: Test connection to all hosts
  - cmd: ansible all -a 'uptime'
    desc:
      cs: Ad-hoc příkaz na všech serverech
      en: Ad-hoc command on all servers
  - cmd: ansible-playbook deploy.yml
    desc:
      cs: Spustit playbook
      en: Run playbook
  - cmd: ansible-playbook deploy.yml --check
    desc:
      cs: Dry-run (jen ukázat, co by udělal)
      en: Dry-run (preview)
  - cmd: ansible-playbook deploy.yml -l web1
    desc:
      cs: Spustit jen na 'web1'
      en: Run only on 'web1'
  - cmd: ansible-vault encrypt secrets.yml
    desc:
      cs: Zašifrovat soubor s tajnými údaji
      en: Encrypt secrets file
