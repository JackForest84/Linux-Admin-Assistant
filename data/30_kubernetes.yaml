- id: kubectl-pods
  title:
    cs: Kubernetes - pody
    en: Kubernetes - pods
  tags:
    cs:
    - kubernetes
    - k8s
    - kubectl
    - pod
    - kontejner
    en:
    - kubernetes
    - k8s
    - kubectl
    - pod
    - container
  commands:
  - cmd: kubectl get pods
    desc:
      cs: Seznam podů v aktuálním namespace
      en: List pods in current namespace
  - cmd: kubectl get pods -A
    desc:
      cs: Pody ve všech namespace
      en: Pods in all namespaces
  - cmd: kubectl get pods -o wide
    desc:
      cs: Vč. IP, node, atd.
      en: Including IP, node, etc.
  - cmd: kubectl describe pod nazev
    desc:
      cs: Detail podu (events, mounty)
      en: Pod details (events, mounts)
  - cmd: kubectl logs nazev -f
    desc:
      cs: Sledovat logy podu živě
      en: Follow pod logs live
  - cmd: kubectl exec -it nazev -- bash
    desc:
      cs: Shell uvnitř podu
      en: Shell inside pod
  - cmd: kubectl delete pod nazev
    desc:
      cs: Smazat pod (deployment ho znovu vytvoří)
      en: Delete pod (deployment recreates)
- id: kubectl-deploy
  title:
    cs: Kubernetes - deployments a služby
    en: Kubernetes - deployments and services
  tags:
    cs:
    - kubernetes
    - deployment
    - service
    - scale
    - apply
    en:
    - kubernetes
    - deployment
    - service
    - scale
    - apply
  commands:
  - cmd: kubectl apply -f deployment.yaml
    desc:
      cs: Vytvořit/aktualizovat z YAML
      en: Create/update from YAML
  - cmd: kubectl delete -f deployment.yaml
    desc:
      cs: Smazat resources z YAML
      en: Delete resources from YAML
  - cmd: kubectl get deployments
    desc:
      cs: Seznam deploymentů
      en: List deployments
  - cmd: kubectl scale deployment web --replicas=3
    desc:
      cs: Změnit počet replik
      en: Change replica count
  - cmd: kubectl rollout restart deployment web
    desc:
      cs: Rolling restart (postupně)
      en: Rolling restart
  - cmd: kubectl rollout undo deployment web
    desc:
      cs: Vrátit poslední změnu
      en: Undo last change
  - cmd: kubectl get svc
    desc:
      cs: Seznam služeb (services)
      en: List services
- id: kubectl-context
  title:
    cs: Kubernetes - context a namespace
    en: Kubernetes - context and namespace
  tags:
    cs:
    - kubectl
    - context
    - namespace
    - cluster
    - kubeconfig
    en:
    - kubectl
    - context
    - namespace
    - cluster
    - kubeconfig
  commands:
  - cmd: kubectl config get-contexts
    desc:
      cs: Dostupné contexty (clustery)
      en: Available contexts (clusters)
  - cmd: kubectl config use-context jmeno
    desc:
      cs: Přepnout context
      en: Switch context
  - cmd: kubectl get ns
    desc:
      cs: Seznam namespace
      en: List namespaces
  - cmd: kubectl config set-context --current --namespace=prod
    desc:
      cs: Nastavit výchozí namespace
      en: Set default namespace
  - cmd: kubectl cluster-info
    desc:
      cs: Info o clusteru
      en: Cluster info
