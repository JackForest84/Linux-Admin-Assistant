- id: tmux-basic
  title:
    cs: Tmux základy
    en: Tmux basics
  tags:
    cs:
    - tmux
    - terminál
    - session
    - panely
    en:
    - tmux
    - terminal
    - session
    - panes
  commands:
  - cmd: tmux
    desc:
      cs: Spustit novou session
      en: Start new session
  - cmd: tmux new -s prace
    desc:
      cs: Pojmenovaná session 'prace'
      en: Named session 'prace'
  - cmd: tmux ls
    desc:
      cs: Seznam aktivních sessions
      en: List active sessions
  - cmd: tmux attach -t prace
    desc:
      cs: Připojit zpět k session 'prace'
      en: Reattach to session 'prace'
  - cmd: tmux kill-session -t prace
    desc:
      cs: Ukončit konkrétní session
      en: Kill specific session
- id: tmux-keys
  title:
    cs: Tmux klávesové zkratky (prefix Ctrl+b)
    en: Tmux key bindings (prefix Ctrl+b)
  tags:
    cs:
    - tmux
    - zkratky
    - prefix
    - klávesy
    - panely
    - okna
    en:
    - tmux
    - shortcuts
    - prefix
    - keys
    - panes
    - windows
  commands:
  - cmd: Ctrl+b d
    desc:
      cs: Detach (odpojit, ale session běží dál)
      en: Detach (session keeps running)
  - cmd: Ctrl+b %
    desc:
      cs: Rozdělit panel vertikálně
      en: Split pane vertically
  - cmd: Ctrl+b "
    desc:
      cs: Rozdělit panel horizontálně
      en: Split pane horizontally
  - cmd: Ctrl+b šipka
    desc:
      cs: Přepnout mezi panely
      en: Switch between panes
  - cmd: Ctrl+b c
    desc:
      cs: Vytvořit nové okno
      en: Create new window
  - cmd: Ctrl+b n
    desc:
      cs: Další okno
      en: Next window
  - cmd: Ctrl+b ,
    desc:
      cs: Přejmenovat okno
      en: Rename window
  - cmd: Ctrl+b x
    desc:
      cs: Zavřít panel
      en: Close pane
- id: screen-basic
  title:
    cs: Screen (alternativa k tmux)
    en: Screen (tmux alternative)
  tags:
    cs:
    - screen
    - terminál
    - session
    en:
    - screen
    - terminal
    - session
  commands:
  - cmd: screen -S prace
    desc:
      cs: Nová pojmenovaná session
      en: New named session
  - cmd: screen -ls
    desc:
      cs: Seznam sessions
      en: List sessions
  - cmd: screen -r prace
    desc:
      cs: Připojit zpět
      en: Reattach
  - cmd: Ctrl+a d
    desc:
      cs: Detach
      en: Detach
