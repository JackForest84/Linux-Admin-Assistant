- id: vim-basics
  title:
    cs: Vim základy
    en: Vim basics
  tags:
    cs:
    - vim
    - editor
    - základy
    - otevřít
    - zavřít
    en:
    - vim
    - editor
    - basics
    - open
    - quit
  commands:
  - cmd: vim soubor.txt
    desc:
      cs: Otevřít soubor
      en: Open file
  - cmd: :w
    desc:
      cs: Uložit (write)
      en: Save (write)
  - cmd: :q
    desc:
      cs: Zavřít
      en: Quit
  - cmd: :wq
    desc:
      cs: Uložit a zavřít
      en: Save and quit
  - cmd: :q!
    desc:
      cs: Zavřít bez uložení
      en: Quit without saving
  - cmd: :x
    desc:
      cs: Uložit (pokud změněno) a zavřít
      en: Save (if changed) and quit
  - cmd: i
    desc:
      cs: Vstoupit do režimu vkládání
      en: Enter insert mode
  - cmd: Esc
    desc:
      cs: Zpět do normálního režimu
      en: Back to normal mode
- id: vim-edit
  title:
    cs: Vim úpravy
    en: Vim editing
  tags:
    cs:
    - vim
    - úpravy
    - kopírovat
    - mazat
    - yank
    - paste
    en:
    - vim
    - edit
    - copy
    - delete
    - yank
    - paste
  commands:
  - cmd: dd
    desc:
      cs: Smazat řádek
      en: Delete line
  - cmd: 5dd
    desc:
      cs: Smazat 5 řádků
      en: Delete 5 lines
  - cmd: yy
    desc:
      cs: Zkopírovat řádek (yank)
      en: Copy line (yank)
  - cmd: p
    desc:
      cs: Vložit pod kurzor (paste)
      en: Paste below cursor
  - cmd: u
    desc:
      cs: Zpět (undo)
      en: Undo
  - cmd: Ctrl+r
    desc:
      cs: Znovu (redo)
      en: Redo
  - cmd: :%s/staré/nové/g
    desc:
      cs: Nahradit všude v souboru
      en: Replace everywhere in file
  - cmd: :%s/staré/nové/gc
    desc:
      cs: Nahradit s potvrzením každé změny
      en: Replace with confirmation per change
- id: vim-nav
  title:
    cs: Vim navigace
    en: Vim navigation
  tags:
    cs:
    - vim
    - navigace
    - hledat
    - řádek
    - skok
    en:
    - vim
    - navigation
    - search
    - line
    - jump
  commands:
  - cmd: gg
    desc:
      cs: Na začátek souboru
      en: Go to top of file
  - cmd: G
    desc:
      cs: Na konec souboru
      en: Go to end of file
  - cmd: :42
    desc:
      cs: Skočit na řádek 42
      en: Jump to line 42
  - cmd: /hledej
    desc:
      cs: Hledat dopředu (n = další)
      en: Search forward (n = next)
  - cmd: ?hledej
    desc:
      cs: Hledat dozadu
      en: Search backward
  - cmd: '0'
    desc:
      cs: Na začátek řádku
      en: Start of line
  - cmd: $
    desc:
      cs: Na konec řádku
      en: End of line
- id: nano-basics
  title:
    cs: Nano (jednodušší editor)
    en: Nano (simpler editor)
  tags:
    cs:
    - nano
    - editor
    - jednoduchý
    en:
    - nano
    - editor
    - simple
  commands:
  - cmd: nano soubor.txt
    desc:
      cs: Otevřít soubor
      en: Open file
  - cmd: Ctrl+O
    desc:
      cs: Uložit
      en: Save
  - cmd: Ctrl+X
    desc:
      cs: Zavřít
      en: Exit
  - cmd: Ctrl+W
    desc:
      cs: Hledat
      en: Search
  - cmd: Ctrl+K
    desc:
      cs: Vyříznout řádek
      en: Cut line
  - cmd: Ctrl+U
    desc:
      cs: Vložit
      en: Paste
