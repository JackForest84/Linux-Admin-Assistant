- id: hw-overview
  title:
    cs: Hardware - přehled
    en: Hardware overview
  tags:
    cs:
    - hardware
    - hw
    - lshw
    - lspci
    - lsusb
    - info
    en:
    - hardware
    - hw
    - lshw
    - lspci
    - lsusb
    - info
  commands:
  - cmd: sudo lshw -short
    desc:
      cs: Kompletní přehled HW (stručně)
      en: Complete HW overview (brief)
  - cmd: sudo lshw -class disk -class storage
    desc:
      cs: Jen disky a řadiče
      en: Only disks and controllers
  - cmd: lspci
    desc:
      cs: PCI zařízení (síťovky, GPU)
      en: PCI devices (NICs, GPU)
  - cmd: lspci -v
    desc:
      cs: Podrobně (drivery)
      en: Verbose (drivers)
  - cmd: lsusb
    desc:
      cs: USB zařízení
      en: USB devices
  - cmd: sudo dmidecode -t system
    desc:
      cs: Výrobce, model, BIOS
      en: Manufacturer, model, BIOS
- id: hw-disk-health
  title:
    cs: Zdraví disků (SMART)
    en: Disk health (SMART)
  tags:
    cs:
    - smart
    - disk
    - zdraví
    - smartctl
    - závada
    en:
    - smart
    - disk
    - health
    - smartctl
    - failure
  commands:
  - cmd: sudo smartctl -a /dev/sda
    desc:
      cs: SMART hodnoty disku
      en: Disk SMART values
  - cmd: sudo smartctl -H /dev/sda
    desc:
      cs: Stručný stav (PASSED / FAILED)
      en: Brief status (PASSED / FAILED)
  - cmd: sudo smartctl -t short /dev/sda
    desc:
      cs: Spustit krátký self-test
      en: Run short self-test
  - cmd: sudo nvme smart-log /dev/nvme0
    desc:
      cs: SMART pro NVMe disk
      en: SMART for NVMe disk
- id: hw-temp
  title:
    cs: Teploty
    en: Temperatures
  tags:
    cs:
    - teplota
    - temp
    - sensors
    - lm-sensors
    en:
    - temperature
    - temp
    - sensors
    - lm-sensors
  commands:
  - cmd: sensors
    desc:
      cs: Teploty CPU/desky (apt install lm-sensors)
      en: CPU/mainboard temps
  - cmd: sudo sensors-detect --auto
    desc:
      cs: Inicializovat senzory (po instalaci)
      en: Initialize sensors (after install)
  - cmd: watch -n 2 sensors
    desc:
      cs: Sledovat teploty živě
      en: Watch temps live
- id: hw-power
  title:
    cs: Baterie a napájení
    en: Battery and power
  tags:
    cs:
    - baterie
    - battery
    - napájení
    - power
    - upower
    en:
    - battery
    - power
    - upower
  commands:
  - cmd: upower -i $(upower -e | grep BAT)
    desc:
      cs: Stav baterie (procenta, kapacita)
      en: Battery status (percent, capacity)
  - cmd: cat /sys/class/power_supply/BAT0/capacity
    desc:
      cs: Jen procenta baterie
      en: Just battery percent
