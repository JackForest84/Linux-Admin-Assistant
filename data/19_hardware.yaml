        nl: "Beknopte status (PASSED / FAILED)"
        hu: "Rövid állapot (PASSED / FAILED)"
    - cmd: "sudo smartctl -t short /dev/sda"
      desc:
        en: "Run short self-test"
        cs: "Spustit krátký self-test"
