        nl: "SMART-waarden van schijf"
        hu: "Lemez SMART értékek"
    - cmd: "sudo smartctl -H /dev/sda"
      desc:
        en: "Brief status (PASSED / FAILED)"
        cs: "Stručný stav (PASSED / FAILED)"
        sk: "Stručný stav (PASSED / FAILED)"
        de: "Kurzstatus (PASSED / FAILED)"
        es: "Estado breve (PASSED / FAILED)"
        fr: "État court (PASSED / FAILED)"
