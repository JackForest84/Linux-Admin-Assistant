- id: lvm-basics
  title:
    cs: LVM (Logical Volume Manager)
    en: LVM (Logical Volume Manager)
  tags:
    cs:
    - lvm
    - oddíl
    - partition
    - pv
    - vg
    - lv
    - volume
    en:
    - lvm
    - partition
    - pv
    - vg
    - lv
    - volume
  commands:
  - cmd: sudo pvs
    desc:
      cs: Physical volumes (fyzické disky)
      en: Physical volumes
  - cmd: sudo vgs
    desc:
      cs: Volume groups (skupiny)
      en: Volume groups
  - cmd: sudo lvs
    desc:
      cs: Logical volumes (oddíly)
      en: Logical volumes
  - cmd: sudo lvextend -L +10G /dev/vg/lv
    desc:
      cs: Zvětšit LV o 10 GB
      en: Extend LV by 10 GB
  - cmd: sudo lvextend -l +100%FREE /dev/vg/lv
    desc:
      cs: Použít všechno volné místo
      en: Use all free space
  - cmd: sudo resize2fs /dev/vg/lv
    desc:
      cs: Zvětšit ext4 filesystem na max
      en: Resize ext4 filesystem to max
  - cmd: sudo xfs_growfs /mnt
    desc:
      cs: Zvětšit XFS (musí být připojený)
      en: Grow XFS (must be mounted)
- id: mkfs-fsck
  title:
    cs: Vytvořit / opravit filesystem
    en: Create / repair filesystem
  tags:
    cs:
    - mkfs
    - fsck
    - formátovat
    - oprava
    - filesystem
    en:
    - mkfs
    - fsck
    - format
    - repair
    - filesystem
  commands:
  - cmd: sudo mkfs.ext4 /dev/sdb1
    desc:
      cs: Formátovat na ext4
      en: Format as ext4
  - cmd: sudo mkfs.xfs /dev/sdb1
    desc:
      cs: Formátovat na XFS
      en: Format as XFS
  - cmd: sudo mkfs.vfat -F32 /dev/sdb1
    desc:
      cs: FAT32 (USB klíčenky)
      en: FAT32 (USB sticks)
  - cmd: sudo fsck /dev/sdb1
    desc:
      cs: Zkontrolovat filesystem (odpojený!)
      en: Check filesystem (unmounted!)
  - cmd: sudo fsck -y /dev/sdb1
    desc:
      cs: Automaticky opravit (odpovídat 'yes')
      en: Auto-repair (answer 'yes')
  - cmd: sudo tune2fs -l /dev/sda1
    desc:
      cs: Detailní info o ext filesystému
      en: Detailed ext filesystem info
- id: swap
  title:
    cs: Swap (odkládací prostor)
    en: Swap (swap space)
  tags:
    cs:
    - swap
    - swapfile
    - paměť
    - ram
    - odkládací
    en:
    - swap
    - swapfile
    - memory
    - ram
  commands:
  - cmd: swapon --show
    desc:
      cs: Aktivní swap
      en: Active swap
  - cmd: sudo fallocate -l 2G /swapfile
    desc:
      cs: Vytvořit 2GB swap soubor
      en: Create 2GB swap file
  - cmd: sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
    desc:
      cs: Zformátovat a aktivovat
      en: Format and activate
  - cmd: sudo swapoff /swapfile
    desc:
      cs: Deaktivovat swap
      en: Disable swap
  - cmd: cat /proc/sys/vm/swappiness
    desc:
      cs: Současná hodnota swappiness (0-100)
      en: Current swappiness value (0-100)
