- id: nfs-mount
  title:
    cs: NFS - sdílení souborů (Linux)
    en: NFS - file sharing (Linux)
  tags:
    cs:
    - nfs
    - sdílení
    - mount
    - síťový
    - disk
    en:
    - nfs
    - share
    - mount
    - network
    - drive
  commands:
  - cmd: sudo apt install nfs-common
    desc:
      cs: 'Klient: nainstalovat balíček'
      en: 'Client: install package'
  - cmd: sudo mount -t nfs 192.168.1.10:/export /mnt
    desc:
      cs: Připojit NFS share
      en: Mount NFS share
  - cmd: showmount -e 192.168.1.10
    desc:
      cs: Vypsat exporty serveru
      en: List server exports
  - cmd: sudo apt install nfs-kernel-server
    desc:
      cs: 'Server: nainstalovat'
      en: 'Server: install'
  - cmd: sudo exportfs -rav
    desc:
      cs: 'Server: znovu načíst /etc/exports'
      en: 'Server: reload /etc/exports'
- id: smb-cifs
  title:
    cs: Samba / CIFS (Windows sdílení)
    en: Samba / CIFS (Windows share)
  tags:
    cs:
    - samba
    - cifs
    - smb
    - windows
    - sdílení
    en:
    - samba
    - cifs
    - smb
    - windows
    - share
  commands:
  - cmd: sudo apt install cifs-utils
    desc:
      cs: Nainstalovat CIFS klienta
      en: Install CIFS client
  - cmd: sudo mount -t cifs //server/share /mnt -o username=user
    desc:
      cs: Připojit SMB share
      en: Mount SMB share
  - cmd: smbclient -L //192.168.1.10 -U user
    desc:
      cs: Vypsat dostupné shares na serveru
      en: List available shares on server
  - cmd: smbclient //server/share -U user
    desc:
      cs: Interaktivní klient (jako FTP)
      en: Interactive client (like FTP)
- id: sshfs
  title:
    cs: SSHFS - mount přes SSH
    en: SSHFS - mount over SSH
  tags:
    cs:
    - sshfs
    - fuse
    - mount
    - ssh
    - vzdálený
    en:
    - sshfs
    - fuse
    - mount
    - ssh
    - remote
  commands:
  - cmd: sudo apt install sshfs
    desc:
      cs: Nainstalovat
      en: Install
  - cmd: sshfs user@host:/cesta /mnt
    desc:
      cs: Připojit vzdálený adresář přes SSH
      en: Mount remote directory via SSH
  - cmd: fusermount -u /mnt
    desc:
      cs: Odpojit
      en: Unmount
- id: fstab
  title:
    cs: Trvalé mountování (fstab)
    en: Permanent mounts (fstab)
  tags:
    cs:
    - fstab
    - mount
    - trvalý
    - boot
    - autostart
    en:
    - fstab
    - mount
    - permanent
    - boot
    - autostart
  commands:
  - cmd: sudo cp /etc/fstab /etc/fstab.bak
    desc:
      cs: Záloha fstab před úpravou (důležité!)
      en: Backup fstab before edit (important!)
  - cmd: sudo nano /etc/fstab
    desc:
      cs: Upravit fstab
      en: Edit fstab
  - cmd: sudo mount -a
    desc:
      cs: Připojit vše z fstab (test)
      en: Mount everything from fstab (test)
  - cmd: lsblk -f
    desc:
      cs: Najít UUID disků (pro fstab)
      en: Find disk UUIDs (for fstab)
  - cmd: echo 'UUID=xxx /mnt ext4 defaults 0 2' | sudo tee -a /etc/fstab
    desc:
      cs: Příklad záznamu (uprav UUID a cestu)
      en: Example entry (edit UUID and path)
