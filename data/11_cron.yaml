- id: cron-edit
  title:
    cs: Plánované úlohy (cron)
    en: Scheduled tasks (cron)
  tags:
    cs:
    - cron
    - crontab
    - plánovat
    - scheduler
    - úloha
    - automaticky
    en:
    - cron
    - crontab
    - schedule
    - scheduler
    - task
  commands:
  - cmd: crontab -e
    desc:
      cs: Upravit crontab aktuálního uživatele
      en: Edit current user's crontab
  - cmd: crontab -l
    desc:
      cs: Vypsat naplánované úlohy
      en: List scheduled tasks
  - cmd: sudo crontab -e -u root
    desc:
      cs: Upravit root crontab
      en: Edit root crontab
  - cmd: crontab -r
    desc:
      cs: Smazat všechny úlohy (POZOR)
      en: Delete all tasks (CAREFUL)
- id: cron-syntax
  title:
    cs: Cron syntaxe (příklady)
    en: Cron syntax (examples)
  tags:
    cs:
    - cron
    - syntaxe
    - čas
    - příklad
    - minuta
    - hodina
    en:
    - cron
    - syntax
    - time
    - example
    - minute
    - hour
  commands:
  - cmd: '*/5 * * * * /opt/script.sh'
    desc:
      cs: Každých 5 minut
      en: Every 5 minutes
  - cmd: 0 3 * * * /opt/backup.sh
    desc:
      cs: Každý den ve 3:00
      en: Every day at 3:00
  - cmd: 0 0 * * 0 /opt/weekly.sh
    desc:
      cs: Každou neděli o půlnoci
      en: Every Sunday at midnight
  - cmd: '@reboot /opt/onboot.sh'
    desc:
      cs: Při každém startu systému
      en: On every system boot
  - cmd: 0 9-17 * * 1-5 /opt/pracovni.sh
    desc:
      cs: Každou celou hodinu 9-17 v pracovních dnech
      en: Every hour 9-17 on weekdays
- id: systemd-timer
  title:
    cs: Systemd timer (moderní alternativa cronu)
    en: Systemd timer (modern cron alternative)
  tags:
    cs:
    - systemd
    - timer
    - časovač
    - plánovat
    en:
    - systemd
    - timer
    - schedule
  commands:
  - cmd: systemctl list-timers
    desc:
      cs: Všechny aktivní timery (kdy poběží)
      en: All active timers (when they run)
  - cmd: systemctl status mojeUloha.timer
    desc:
      cs: Stav konkrétního timeru
      en: Status of specific timer
  - cmd: sudo systemctl enable --now mojeUloha.timer
    desc:
      cs: Zapnout timer + po startu systému
      en: Enable timer + on boot
- id: at-jobs
  title:
    cs: Jednorázové úlohy (at)
    en: One-shot scheduled jobs (at)
  tags:
    cs:
    - at
    - jednorázové
    - plánovat
    - později
    en:
    - at
    - one-shot
    - schedule
    - later
  commands:
  - cmd: echo 'sudo reboot' | at 03:00
    desc:
      cs: Spustit příkaz ve 3:00
      en: Run command at 3:00
  - cmd: echo 'backup.sh' | at now + 1 hour
    desc:
      cs: Za hodinu
      en: In one hour
  - cmd: atq
    desc:
      cs: Seznam čekajících úloh
      en: List of pending jobs
  - cmd: atrm 5
    desc:
      cs: Zrušit úlohu č. 5
      en: Cancel job number 5
