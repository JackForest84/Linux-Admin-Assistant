- id: net-ip
  title:
    cs: IP adresy a síťová rozhraní
    en: IP addresses and network interfaces
  tags:
    cs:
    - síť
    - ip
    - adresa
    - rozhraní
    - ifconfig
    en:
    - network
    - ip
    - address
    - interface
    - ifconfig
  commands:
  - cmd: ip a
    desc:
      cs: Všechna rozhraní a IP adresy
      en: All interfaces and IP addresses
  - cmd: ip -br a
    desc:
      cs: Stručný přehled (jeden řádek na rozhraní)
      en: Brief view (one line per interface)
  - cmd: hostname -I
    desc:
      cs: Jen IP adresy tohoto stroje
      en: Just this machine's IP addresses
  - cmd: curl -s ifconfig.me
    desc:
      cs: Veřejná IP adresa
      en: Public IP address
- id: net-ports
  title:
    cs: Otevřené porty a poslouchající služby
    en: Open ports and listening services
  tags:
    cs:
    - porty
    - ss
    - netstat
    - poslouchá
    - listening
    - otevřené
    en:
    - ports
    - ss
    - netstat
    - listening
    - open
  commands:
  - cmd: sudo ss -tulnp
    desc:
      cs: TCP/UDP porty + jaký proces je drží
      en: TCP/UDP ports + which process owns them
  - cmd: sudo ss -tlnp
    desc:
      cs: Jen TCP poslouchající
      en: Only TCP listening
  - cmd: sudo lsof -i -P -n
    desc:
      cs: Všechna síťová spojení a porty
      en: All network connections and ports
  - cmd: sudo lsof -i :80
    desc:
      cs: Kdo používá port 80
      en: Who uses port 80
- id: net-test
  title:
    cs: Test konektivity
    en: Test connectivity
  tags:
    cs:
    - ping
    - traceroute
    - dns
    - test
    - spojení
    - internet
    en:
    - ping
    - traceroute
    - dns
    - test
    - connection
  commands:
  - cmd: ping -c 4 8.8.8.8
    desc:
      cs: 4× ping na Google DNS
      en: 4× ping to Google DNS
  - cmd: traceroute google.com
    desc:
      cs: Cesta paketu (každý hop)
      en: Packet route (each hop)
  - cmd: dig google.com
    desc:
      cs: DNS dotaz s detaily
      en: DNS query with details
  - cmd: nslookup google.com
    desc:
      cs: Jednodušší DNS překlad
      en: Simpler DNS lookup
  - cmd: curl -I https://example.com
    desc:
      cs: Jen HTTP hlavičky odpovědi
      en: Only HTTP response headers
- id: net-download
  title:
    cs: Stáhnout soubor
    en: Download file
  tags:
    cs:
    - stáhnout
    - download
    - curl
    - wget
    en:
    - download
    - curl
    - wget
  commands:
  - cmd: curl -O https://example.com/file.tar.gz
    desc:
      cs: Uložit pod původním názvem
      en: Save under original name
  - cmd: curl -L -o out.tar.gz https://example.com/file
    desc:
      cs: Následovat redirecty, uložit pod novým jménem
      en: Follow redirects, save as new name
  - cmd: wget https://example.com/file.tar.gz
    desc:
      cs: Stáhnout s wget (s progress barem)
      en: Download with wget (with progress)
- id: net-firewall
  title:
    cs: UFW firewall
    en: UFW firewall
  tags:
    cs:
    - firewall
    - ufw
    - povolit
    - zakázat
    - port
    en:
    - firewall
    - ufw
    - allow
    - deny
    - port
  commands:
  - cmd: sudo ufw status verbose
    desc:
      cs: Stav firewallu + pravidla
      en: Firewall status + rules
  - cmd: sudo ufw allow 80/tcp
    desc:
      cs: Povolit příchozí port 80
      en: Allow incoming port 80
  - cmd: sudo ufw allow from 192.168.1.0/24
    desc:
      cs: Povolit vše z lokální sítě
      en: Allow everything from local network
  - cmd: sudo ufw delete allow 80/tcp
    desc:
      cs: Smazat pravidlo
      en: Delete rule
  - cmd: sudo ufw enable
    desc:
      cs: Zapnout firewall
      en: Enable firewall
