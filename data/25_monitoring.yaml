- id: io-monitor
  title:
    cs: I/O monitoring (disky)
    en: I/O monitoring (disks)
  tags:
    cs:
    - iotop
    - iostat
    - io
    - disk
    - výkon
    - monitoring
    en:
    - iotop
    - iostat
    - io
    - disk
    - performance
    - monitoring
  commands:
  - cmd: sudo iotop
    desc:
      cs: Které procesy zatěžují disk (apt install iotop)
      en: Which processes load disk
  - cmd: iostat -xz 2
    desc:
      cs: I/O statistiky každé 2 vteřiny (apt install sysstat)
      en: I/O stats every 2 seconds
  - cmd: sudo dstat -tcmnd
    desc:
      cs: Kombinovaný monitor (CPU, RAM, síť, disk)
      en: Combined monitor (CPU, RAM, net, disk)
  - cmd: vmstat 2
    desc:
      cs: Statistiky systému každé 2 vteřiny
      en: System stats every 2 seconds
- id: net-monitor
  title:
    cs: Síťové monitorování
    en: Network monitoring
  tags:
    cs:
    - iftop
    - nethogs
    - síť
    - monitoring
    - provoz
    en:
    - iftop
    - nethogs
    - network
    - monitoring
    - traffic
  commands:
  - cmd: sudo iftop -i eth0
    desc:
      cs: Živý provoz na rozhraní
      en: Live traffic on interface
  - cmd: sudo nethogs
    desc:
      cs: Které procesy posílají data
      en: Which processes send data
  - cmd: sudo tcpdump -i eth0 port 80
    desc:
      cs: Zachytávat provoz na portu 80
      en: Capture traffic on port 80
  - cmd: sudo tcpdump -i eth0 -w out.pcap
    desc:
      cs: Uložit zachycený provoz do souboru
      en: Save captured traffic to file
  - cmd: speedtest-cli
    desc:
      cs: Test rychlosti internetu (pip install speedtest-cli)
      en: Internet speed test
- id: bench
  title:
    cs: Výkonnostní testy
    en: Performance benchmarks
  tags:
    cs:
    - benchmark
    - výkon
    - test
    - sysbench
    - hdparm
    en:
    - benchmark
    - performance
    - test
    - sysbench
    - hdparm
  commands:
  - cmd: sudo hdparm -t /dev/sda
    desc:
      cs: Rychlost čtení disku
      en: Disk read speed
  - cmd: dd if=/dev/zero of=test.bin bs=1M count=1024 conv=fdatasync
    desc:
      cs: Rychlost zápisu (vytvoří 1 GB soubor)
      en: Write speed (creates 1 GB file)
  - cmd: sysbench cpu --threads=4 run
    desc:
      cs: Benchmark CPU
      en: CPU benchmark
  - cmd: stress-ng --cpu 4 --timeout 30s
    desc:
      cs: Stres test CPU na 30 vteřin
      en: CPU stress test for 30 seconds
- id: open-files
  title:
    cs: Otevřené soubory a deskriptory
    en: Open files and descriptors
  tags:
    cs:
    - lsof
    - otevřené
    - soubory
    - descriptor
    - handle
    en:
    - lsof
    - open
    - files
    - descriptor
    - handle
  commands:
  - cmd: sudo lsof -p 1234
    desc:
      cs: Co má otevřeno proces s PID 1234
      en: What process 1234 has open
  - cmd: sudo lsof /var/log/syslog
    desc:
      cs: Kdo má otevřený tento soubor
      en: Who has this file open
  - cmd: sudo lsof +D /opt
    desc:
      cs: Vše otevřené uvnitř /opt
      en: Everything open inside /opt
  - cmd: ulimit -n
    desc:
      cs: Limit otevřených souborů (na uživatele)
      en: Open files limit (per user)
