- id: fail2ban
  title:
    cs: Fail2ban (ochrana proti brute-force)
    en: Fail2ban (brute-force protection)
  tags:
    cs:
    - fail2ban
    - ban
    - brute
    - force
    - ochrana
    en:
    - fail2ban
    - ban
    - brute
    - force
    - protection
  commands:
  - cmd: sudo fail2ban-client status
    desc:
      cs: Souhrn (které jaily jsou aktivní)
      en: Summary (active jails)
  - cmd: sudo fail2ban-client status sshd
    desc:
      cs: Detail SSH jailu (zabanované IP)
      en: SSH jail detail (banned IPs)
  - cmd: sudo fail2ban-client set sshd unbanip 1.2.3.4
    desc:
      cs: Odbanovat IP
      en: Unban IP
  - cmd: sudo fail2ban-client reload
    desc:
      cs: Znovu načíst konfiguraci
      en: Reload config
  - cmd: sudo tail -f /var/log/fail2ban.log
    desc:
      cs: Sledovat akce fail2ban živě
      en: Watch fail2ban actions live
- id: openssl-cert
  title:
    cs: OpenSSL - certifikáty
    en: OpenSSL - certificates
  tags:
    cs:
    - openssl
    - certifikát
    - ssl
    - tls
    - klíč
    en:
    - openssl
    - certificate
    - ssl
    - tls
    - key
  commands:
  - cmd: openssl s_client -connect example.com:443
    desc:
      cs: Otestovat TLS spojení
      en: Test TLS connection
  - cmd: echo | openssl s_client -connect example.com:443 2>/dev/null | openssl x509 -noout -dates
    desc:
      cs: Datum platnosti certifikátu
      en: Certificate validity dates
  - cmd: openssl x509 -in cert.pem -noout -text
    desc:
      cs: Dekódovat certifikát do textu
      en: Decode certificate to text
  - cmd: openssl genrsa -out klic.pem 4096
    desc:
      cs: Vygenerovat RSA klíč 4096 bit
      en: Generate RSA 4096-bit key
  - cmd: openssl req -new -key klic.pem -out csr.pem
    desc:
      cs: Vytvořit CSR (žádost o certifikát)
      en: Create CSR (certificate request)
  - cmd: openssl req -x509 -newkey rsa:4096 -keyout klic.pem -out cert.pem -days 365 -nodes
    desc:
      cs: Self-signed certifikát na 365 dní
      en: Self-signed cert for 365 days
- id: certbot
  title:
    cs: Let's Encrypt (certbot)
    en: Let's Encrypt (certbot)
  tags:
    cs:
    - certbot
    - letsencrypt
    - https
    - certifikát
    en:
    - certbot
    - letsencrypt
    - https
    - certificate
  commands:
  - cmd: sudo certbot --nginx -d example.com
    desc:
      cs: Získat + nastavit HTTPS pro nginx
      en: Obtain + configure HTTPS for nginx
  - cmd: sudo certbot --apache -d example.com
    desc:
      cs: Pro Apache
      en: For Apache
  - cmd: sudo certbot certonly --standalone -d example.com
    desc:
      cs: Jen získat cert (bez auto-configu)
      en: Just obtain cert (no auto-config)
  - cmd: sudo certbot renew --dry-run
    desc:
      cs: Test obnovení
      en: Test renewal
  - cmd: sudo certbot certificates
    desc:
      cs: Seznam získaných certifikátů
      en: List obtained certificates
- id: gpg
  title:
    cs: GPG (šifrování a podpisy)
    en: GPG (encryption and signing)
  tags:
    cs:
    - gpg
    - šifrování
    - podpis
    - klíč
    - encrypt
    en:
    - gpg
    - encrypt
    - sign
    - key
  commands:
  - cmd: gpg --gen-key
    desc:
      cs: Vygenerovat GPG klíčový pár
      en: Generate GPG key pair
  - cmd: gpg --list-keys
    desc:
      cs: Veřejné klíče v klíčence
      en: Public keys in keyring
  - cmd: gpg --export -a 'jméno' > klic.asc
    desc:
      cs: Exportovat veřejný klíč
      en: Export public key
  - cmd: gpg -c soubor.txt
    desc:
      cs: Zašifrovat heslem (symetricky)
      en: Encrypt with password (symmetric)
  - cmd: gpg soubor.txt.gpg
    desc:
      cs: Dešifrovat
      en: Decrypt
  - cmd: gpg -e -r prijemce soubor.txt
    desc:
      cs: Zašifrovat pro příjemce (asymetricky)
      en: Encrypt for recipient (asymmetric)
- id: hash
  title:
    cs: Kontrolní součty (hash)
    en: Checksums (hash)
  tags:
    cs:
    - hash
    - md5
    - sha256
    - kontrolní
    - součet
    - checksum
    en:
    - hash
    - md5
    - sha256
    - checksum
  commands:
  - cmd: md5sum soubor
    desc:
      cs: MD5 hash souboru
      en: MD5 hash of file
  - cmd: sha256sum soubor
    desc:
      cs: SHA-256 hash souboru
      en: SHA-256 hash of file
  - cmd: sha256sum -c soubor.sha256
    desc:
      cs: Ověřit podle .sha256 souboru
      en: Verify against .sha256 file
  - cmd: echo -n 'text' | sha256sum
    desc:
      cs: Hash z řetězce
      en: Hash from string
