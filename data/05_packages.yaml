    hu: [apt, frissítés, update, upgrade, csomagok]
  commands:
    - cmd: "sudo apt update"
      desc:
        en: "Refresh package index"
        cs: "Stáhnout seznam dostupných balíčků"
        sk: "Stiahnuť zoznam dostupných balíčkov"
        de: "Paketindex aktualisieren"
        es: "Actualizar índice de paquetes"
        fr: "Rafraîchir l'index des paquets"
        it: "Aggiornare l'indice dei pacchetti"
        pl: "Odśwież indeks pakietów"
        tr: "Paket dizinini yenile"
        pt: "Atualizar índice de pacotes"
        nl: "Pakketindex verversen"
        hu: "Csomagindex frissítése"
    - cmd: "sudo apt upgrade -y"
      desc:
        en: "Install available upgrades"
        cs: "Nainstalovat dostupné aktualizace"
        sk: "Nainštalovať dostupné aktualizácie"
        de: "Verfügbare Upgrades installieren"
        es: "Instalar actualizaciones disponibles"
        fr: "Installer les mises à jour disponibles"
