        tr: "Mevcut yükseltmeleri kur"
        pt: "Instalar atualizações disponíveis"
        nl: "Beschikbare upgrades installeren"
        hu: "Elérhető frissítések telepítése"
    - cmd: "sudo apt full-upgrade -y"
      desc:
        en: "Upgrade including dependency changes"
        cs: "Upgrade včetně řešení změn závislostí"
        sk: "Upgrade vrátane riešenia zmien závislostí"
        de: "Upgrade inkl. Abhängigkeitsänderungen"
        es: "Actualización incl. cambios de dependencias"
        fr: "Mise à jour avec changements de dépendances"
        it: "Upgrade con modifiche dipendenze"
        pl: "Aktualizacja wraz ze zmianami zależności"
        tr: "Bağımlılık değişiklikleri dahil yükseltme"
        pt: "Atualização incluindo mudanças de dependências"
        nl: "Upgrade inclusief afhankelijkheidsveranderingen"
        hu: "Frissítés a függőségi változásokkal"
    - cmd: "sudo apt update && sudo apt upgrade -y && sudo apt autoremove -y"
      desc:
        en: "Full cycle: update + upgrade + cleanup"
        cs: "Plný cyklus: update + upgrade + úklid"
        sk: "Plný cyklus: update + upgrade + upratovanie"
        de: "Voller Zyklus: update + upgrade + cleanup"
        es: "Ciclo completo: update + upgrade + limpieza"
        fr: "Cycle complet : update + upgrade + nettoyage"
        it: "Ciclo completo: update + upgrade + pulizia"
        pl: "Pełny cykl: update + upgrade + sprzątanie"
        tr: "Tam döngü: update + upgrade + temizlik"
        pt: "Ciclo completo: update + upgrade + limpeza"
        nl: "Volledige cyclus: update + upgrade + opruimen"
        hu: "Teljes ciklus: update + upgrade + tisztítás"

