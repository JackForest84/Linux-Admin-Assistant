- id: nginx-control
  title:
    cs: Nginx - správa
    en: Nginx - management
  tags:
    cs:
    - nginx
    - restart
    - reload
    - test
    - konfigurace
    en:
    - nginx
    - restart
    - reload
    - test
    - config
  commands:
  - cmd: sudo nginx -t
    desc:
      cs: Test konfigurace (před reloadem!)
      en: Test config (before reload!)
  - cmd: sudo systemctl reload nginx
    desc:
      cs: Načíst konfiguraci bez výpadku
      en: Reload config without downtime
  - cmd: sudo systemctl restart nginx
    desc:
      cs: Plný restart
      en: Full restart
  - cmd: sudo nginx -s reload
    desc:
      cs: Alternativní reload
      en: Alternative reload
  - cmd: sudo nginx -V
    desc:
      cs: Verze + zkompilované moduly
      en: Version + compiled modules
- id: nginx-sites
  title:
    cs: Nginx - virtual hosts
    en: Nginx - virtual hosts
  tags:
    cs:
    - nginx
    - vhost
    - site
    - povolit
    - zakázat
    en:
    - nginx
    - vhost
    - site
    - enable
    - disable
  commands:
  - cmd: ls /etc/nginx/sites-available/
    desc:
      cs: Dostupné konfigurace
      en: Available configs
  - cmd: ls /etc/nginx/sites-enabled/
    desc:
      cs: Aktivní (zapnuté) konfigurace
      en: Active (enabled) configs
  - cmd: sudo ln -s /etc/nginx/sites-available/site /etc/nginx/sites-enabled/
    desc:
      cs: Zapnout virtual host
      en: Enable virtual host
  - cmd: sudo rm /etc/nginx/sites-enabled/site
    desc:
      cs: Vypnout virtual host
      en: Disable virtual host
  - cmd: sudo tail -f /var/log/nginx/access.log
    desc:
      cs: Sledovat access log
      en: Watch access log
  - cmd: sudo tail -f /var/log/nginx/error.log
    desc:
      cs: Sledovat error log
      en: Watch error log
- id: apache-control
  title:
    cs: Apache - správa
    en: Apache - management
  tags:
    cs:
    - apache
    - apache2
    - httpd
    - restart
    - reload
    en:
    - apache
    - apache2
    - httpd
    - restart
    - reload
  commands:
  - cmd: sudo apache2ctl configtest
    desc:
      cs: Test konfigurace
      en: Test config
  - cmd: sudo systemctl reload apache2
    desc:
      cs: Reload bez výpadku
      en: Reload without downtime
  - cmd: sudo a2enmod rewrite
    desc:
      cs: Zapnout modul
      en: Enable module
  - cmd: sudo a2ensite mysite
    desc:
      cs: Zapnout site
      en: Enable site
  - cmd: sudo a2dissite mysite
    desc:
      cs: Vypnout site
      en: Disable site
