        pt: "Log principal do sistema ao vivo"
        nl: "Hoofdsysteemlog live"
        hu: "Fő rendszernapló élőben"
    - cmd: "sudo tail -f /var/log/auth.log"
      desc:
        en: "Logins, sudo, SSH"
        cs: "Přihlášení, sudo, SSH"
