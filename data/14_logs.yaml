        pl: "Szukaj również w skompresowanych archiwach"
        tr: "Sıkıştırılmış arşivlerde de ara"
        pt: "Buscar também em arquivos comprimidos"
        nl: "Ook in gecomprimeerde archieven zoeken"
        hu: "Keresés tömörített archívumokban is"
    - cmd: "sudo awk '/Failed password/' /var/log/auth.log"
      desc:
