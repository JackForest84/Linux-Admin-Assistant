        pt: "Mensagens do kernel (HW, drivers)"
        nl: "Kernelberichten (HW, drivers)"
        hu: "Kernel üzenetek (HW, illesztők)"
    - cmd: "sudo dmesg -wH"
      desc:
        en: "Kernel log live, human times"
        cs: "Kernel log živě, lidsky čitelné časy"
        sk: "Kernel log živo, ľudsky čitateľné časy"
        de: "Kernel-Log live, menschenlesbare Zeiten"
        es: "Kernel log en vivo, tiempos legibles"
