- id: log-view
  title:
    cs: Prohlížení systémových logů
    en: Viewing system logs
  tags:
    cs:
    - logy
    - log
    - syslog
    - dmesg
    - journal
    en:
    - logs
    - log
    - syslog
    - dmesg
    - journal
  commands:
  - cmd: sudo tail -f /var/log/syslog
    desc:
      cs: Hlavní systémový log živě
      en: Main system log live
  - cmd: sudo tail -f /var/log/auth.log
    desc:
      cs: Přihlášení, sudo, SSH
      en: Logins, sudo, SSH
  - cmd: sudo dmesg | tail -50
    desc:
      cs: Kernel zprávy (HW, drivery)
      en: Kernel messages (HW, drivers)
  - cmd: sudo dmesg -wH
    desc:
      cs: Kernel log živě, lidsky čitelné časy
      en: Kernel log live, human times
  - cmd: last -20
    desc:
      cs: Posledních 20 přihlášení
      en: Last 20 logins
  - cmd: lastb -20
    desc:
      cs: Posledních 20 NEÚSPĚŠNÝCH přihlášení
      en: Last 20 FAILED logins
- id: log-rotate
  title:
    cs: Rotace logů
    en: Log rotation
  tags:
    cs:
    - logrotate
    - rotace
    - logy
    - smazat
    - staré
    en:
    - logrotate
    - rotation
    - logs
    - old
    - delete
  commands:
  - cmd: sudo logrotate -d /etc/logrotate.conf
    desc:
      cs: Test rotace (debug, nic nemění)
      en: Test rotation (debug, no changes)
  - cmd: sudo logrotate -f /etc/logrotate.conf
    desc:
      cs: Vynutit rotaci hned
      en: Force rotation now
  - cmd: sudo journalctl --vacuum-size=500M
    desc:
      cs: Smazat journal logy nad 500 MB
      en: Trim journal logs above 500 MB
  - cmd: sudo journalctl --vacuum-time=30d
    desc:
      cs: Smazat starší než 30 dní
      en: Delete older than 30 days
  - cmd: sudo journalctl --disk-usage
    desc:
      cs: Kolik místa journal zabírá
      en: How much space journal uses
- id: log-search
  title:
    cs: Hledání v logách
    en: Searching in logs
  tags:
    cs:
    - logy
    - grep
    - hledat
    - chyby
    - error
    en:
    - logs
    - grep
    - search
    - errors
  commands:
  - cmd: sudo grep -i error /var/log/syslog | tail -20
    desc:
      cs: Posledních 20 chyb
      en: Last 20 errors
  - cmd: sudo journalctl -p err --since today
    desc:
      cs: Dnešní chyby z journalu
      en: Today's errors from journal
  - cmd: sudo zcat /var/log/syslog.*.gz | grep ssh
    desc:
      cs: Hledat i ve zkomprimovaných archivech
      en: Search in compressed archives too
  - cmd: sudo awk '/Failed password/' /var/log/auth.log
    desc:
      cs: Neúspěšné SSH pokusy
      en: Failed SSH login attempts
