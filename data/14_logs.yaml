        pt: "Kernel log ao vivo, horários legíveis"
        nl: "Kernel-log live, leesbare tijden"
        hu: "Kernel napló élő, olvasható időkkel"
    - cmd: "last -20"
      desc:
        en: "Last 20 logins"
        cs: "Posledních 20 přihlášení"
        sk: "Posledných 20 prihlásení"
        de: "Letzte 20 Anmeldungen"
        es: "Últimos 20 inicios de sesión"
        fr: "20 dernières connexions"
