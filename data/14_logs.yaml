        pt: "Logins, sudo, SSH"
        nl: "Logins, sudo, SSH"
        hu: "Bejelentkezések, sudo, SSH"
    - cmd: "sudo dmesg | tail -50"
      desc:
        en: "Kernel messages (HW, drivers)"
        cs: "Kernel zprávy (HW, drivery)"
        sk: "Kernel správy (HW, drivery)"
        de: "Kernel-Nachrichten (HW, Treiber)"
        es: "Mensajes del kernel (HW, drivers)"
        fr: "Messages du kernel (HW, pilotes)"
