- id: log-rotate
  title:
    en: "Log rotation"
    cs: "Rotace logů"
    sk: "Rotácia logov"
    de: "Log-Rotation"
    es: "Rotación de logs"
    fr: "Rotation des logs"
    it: "Rotazione log"
    pl: "Rotacja logów"
    tr: "Günlük döndürme"
    pt: "Rotação de logs"
    nl: "Logrotatie"
    hu: "Naplók rotálása"
  tags:
    en: [logrotate, rotation, logs, old, delete]
    cs: [logrotate, rotace, logy, smazat, staré]
    sk: [logrotate, rotácia, logy, zmazať, staré]
    de: [logrotate, rotation, logs, alt, löschen]
    es: [logrotate, rotación, logs, antiguos, eliminar]
    fr: [logrotate, rotation, logs, ancien, supprimer]
    it: [logrotate, rotazione, log, vecchi, eliminare]
    pl: [logrotate, rotacja, logi, stare, usuń]
    tr: [logrotate, döndürme, günlükler, eski, sil]
    pt: [logrotate, rotação, logs, antigos, excluir]
    nl: [logrotate, rotatie, logs, oud, verwijderen]
    hu: [logrotate, rotálás, naplók, régi, törlés]
  commands:
    - cmd: "sudo logrotate -d /etc/logrotate.conf"
      desc:
        en: "Test rotation (debug, no changes)"
        cs: "Test rotace (debug, nic nemění)"
        sk: "Test rotácie (debug, nič nemení)"
        de: "Rotation testen (Debug, keine Änderungen)"
        es: "Probar rotación (debug, sin cambios)"
        fr: "Tester la rotation (debug, sans changements)"
        it: "Testare rotazione (debug, no modifiche)"
        pl: "Test rotacji (debug, bez zmian)"
        tr: "Döndürmeyi test et (debug, değişiklik yok)"
        pt: "Testar rotação (debug, sem mudanças)"
        nl: "Rotatie testen (debug, geen wijzigingen)"
        hu: "Rotálás tesztelése (debug, változás nélkül)"
    - cmd: "sudo logrotate -f /etc/logrotate.conf"
      desc:
        en: "Force rotation now"
        cs: "Vynutit rotaci hned"
        sk: "Vynútiť rotáciu hneď"
        de: "Rotation jetzt erzwingen"
        es: "Forzar rotación ahora"
        fr: "Forcer la rotation maintenant"
        it: "Forzare rotazione adesso"
        pl: "Wymuś rotację teraz"
        tr: "Şimdi döndürmeyi zorla"
        pt: "Forçar rotação agora"
        nl: "Rotatie nu forceren"
        hu: "Rotálás kényszerítése most"
    - cmd: "sudo journalctl --vacuum-size=500M"
      desc:
        en: "Trim journal logs above 500 MB"
        cs: "Smazat journal logy nad 500 MB"
        sk: "Zmazať journal logy nad 500 MB"
        de: "Journal-Logs über 500 MB beschneiden"
        es: "Recortar journal logs por encima de 500 MB"
        fr: "Tronquer les journaux au-dessus de 500 Mo"
        it: "Tagliare journal log oltre 500 MB"
        pl: "Przytnij logi journal powyżej 500 MB"
        tr: "500 MB üzeri journal günlüklerini kes"
        pt: "Cortar logs journal acima de 500 MB"
        nl: "Journal-logs boven 500 MB inkorten"
        hu: "Journal naplók 500 MB feletti levágása"
    - cmd: "sudo journalctl --vacuum-time=30d"
      desc:
        en: "Delete older than 30 days"
        cs: "Smazat starší než 30 dní"
        sk: "Zmazať staršie ako 30 dní"
        de: "Älter als 30 Tage löschen"
        es: "Eliminar más antiguos de 30 días"
        fr: "Supprimer plus anciens que 30 jours"
        it: "Eliminare più vecchi di 30 giorni"
        pl: "Usuń starsze niż 30 dni"
        tr: "30 günden eskileri sil"
        pt: "Excluir mais antigos que 30 dias"
        nl: "Ouder dan 30 dagen verwijderen"
        hu: "30 napnál régebbiek törlése"
    - cmd: "sudo journalctl --disk-usage"
      desc:
        en: "How much space journal uses"
        cs: "Kolik místa journal zabírá"
        sk: "Koľko miesta journal zaberá"
        de: "Wie viel Platz das Journal nutzt"
        es: "Cuánto espacio usa el journal"
        fr: "Combien d'espace utilise le journal"
        it: "Quanto spazio usa il journal"
        pl: "Ile miejsca zajmuje journal"
        tr: "Journal ne kadar alan kullanıyor"
        pt: "Quanto espaço o journal usa"
        nl: "Hoeveel ruimte het journal gebruikt"
        hu: "Mennyi helyet használ a journal"

- id: log-search
  title:
    en: "Searching in logs"
    cs: "Hledání v logách"
    sk: "Hľadanie v logoch"
    de: "Suche in Logs"
    es: "Búsqueda en logs"
    fr: "Recherche dans les logs"
