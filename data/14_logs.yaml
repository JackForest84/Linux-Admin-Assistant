    pl: "Wyszukiwanie w logach"
    tr: "Günlüklerde arama"
    pt: "Buscar em logs"
    nl: "Zoeken in logs"
    hu: "Keresés a naplókban"
  tags:
    en: [logs, grep, search, errors]
    cs: [logy, grep, hledat, chyby, error]
    sk: [logy, grep, hľadať, chyby, error]
    de: [logs, grep, suchen, fehler]
