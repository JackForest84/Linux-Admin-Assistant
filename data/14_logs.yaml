        tr: "Son 20 hata"
        pt: "Últimos 20 erros"
        nl: "Laatste 20 fouten"
        hu: "Utolsó 20 hiba"
    - cmd: "sudo journalctl -p err --since today"
      desc:
        en: "Today's errors from journal"
        cs: "Dnešní chyby z journalu"
        sk: "Dnešné chyby z journalu"
        de: "Heutige Fehler aus dem Journal"
        es: "Errores de hoy del journal"
        fr: "Erreurs du jour depuis le journal"
        it: "Errori odierni dal journal"
        pl: "Dzisiejsze błędy z journala"
        tr: "Bugünkü journal hataları"
        pt: "Erros de hoje do journal"
        nl: "Fouten van vandaag uit journal"
        hu: "Mai hibák a journalból"
    - cmd: "sudo zcat /var/log/syslog.*.gz | grep ssh"
      desc:
        en: "Search in compressed archives too"
        cs: "Hledat i ve zkomprimovaných archivech"
        sk: "Hľadať aj v skomprimovaných archívoch"
        de: "Auch in komprimierten Archiven suchen"
        es: "Buscar también en archivos comprimidos"
