- id: ssh-connect
  title:
    cs: SSH připojení
    en: SSH connect
  tags:
    cs:
    - ssh
    - připojení
    - vzdálený
    - server
    en:
    - ssh
    - connect
    - remote
    - server
  commands:
  - cmd: ssh user@192.168.1.10
    desc:
      cs: Připojit se k serveru
      en: Connect to server
  - cmd: ssh -p 2222 user@host
    desc:
      cs: Vlastní port
      en: Custom port
  - cmd: ssh -i ~/.ssh/key user@host
    desc:
      cs: Použít konkrétní klíč
      en: Use specific key
  - cmd: ssh user@host 'uptime && df -h'
    desc:
      cs: Spustit příkaz na serveru a vrátit se
      en: Run command remotely and return
- id: ssh-keys
  title:
    cs: SSH klíče
    en: SSH keys
  tags:
    cs:
    - ssh
    - klíč
    - klic
    - key
    - ssh-keygen
    - ssh-copy-id
    en:
    - ssh
    - key
    - ssh-keygen
    - ssh-copy-id
  commands:
  - cmd: ssh-keygen -t ed25519 -C 'jmeno@stroj'
    desc:
      cs: Vygenerovat nový moderní klíč
      en: Generate new modern key
  - cmd: ssh-copy-id user@host
    desc:
      cs: Nahrát veřejný klíč na server
      en: Upload public key to server
  - cmd: cat ~/.ssh/id_ed25519.pub
    desc:
      cs: Zobrazit veřejný klíč (pro zkopírování)
      en: Show public key (for copying)
  - cmd: ssh-add ~/.ssh/id_ed25519
    desc:
      cs: Přidat klíč do ssh-agenta
      en: Add key to ssh-agent
- id: ssh-tunnel
  title:
    cs: SSH tunel (port forwarding)
    en: SSH tunnel (port forwarding)
  tags:
    cs:
    - ssh
    - tunel
    - tunnel
    - port
    - forwarding
    - proxy
    en:
    - ssh
    - tunnel
    - port
    - forwarding
    - proxy
  commands:
  - cmd: ssh -L 8080:localhost:80 user@host
    desc:
      cs: Lokální 8080 → port 80 na vzdáleném serveru
      en: Local 8080 → port 80 on remote
  - cmd: ssh -R 9000:localhost:3000 user@host
    desc:
      cs: Vystavit lokální port 3000 jako 9000 na serveru
      en: Expose local 3000 as 9000 on server
  - cmd: ssh -D 1080 user@host
    desc:
      cs: SOCKS proxy přes SSH (port 1080)
      en: SOCKS proxy via SSH (port 1080)
- id: ssh-scp
  title:
    cs: Kopírovat soubory přes SSH (scp/rsync)
    en: Copy files via SSH (scp/rsync)
  tags:
    cs:
    - scp
    - rsync
    - kopírovat
    - ssh
    - přenos
    en:
    - scp
    - rsync
    - copy
    - ssh
    - transfer
  commands:
  - cmd: scp soubor.txt user@host:/tmp/
    desc:
      cs: Nahrát soubor na server
      en: Upload file to server
  - cmd: scp user@host:/tmp/soubor.txt .
    desc:
      cs: Stáhnout soubor ze serveru
      en: Download file from server
  - cmd: scp -r slozka/ user@host:/tmp/
    desc:
      cs: Rekurzivně přenést složku
      en: Recursively transfer folder
  - cmd: rsync -avzh slozka/ user@host:/dest/
    desc:
      cs: Rychlejší než scp, podporuje resume
      en: Faster than scp, supports resume
