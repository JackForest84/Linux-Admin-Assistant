- id: git-status
  title:
    cs: Stav repozitáře
    en: Repository status
  tags:
    cs:
    - git
    - status
    - stav
    - změny
    en:
    - git
    - status
    - changes
  commands:
  - cmd: git status
    desc:
      cs: Co je změněno, co ve staging
      en: What's changed, what's staged
  - cmd: git status -s
    desc:
      cs: Stručný formát
      en: Short format
  - cmd: git diff
    desc:
      cs: Změny v souborech (neuložené)
      en: Unstaged changes
  - cmd: git diff --staged
    desc:
      cs: Změny ve staging (před commitem)
      en: Staged changes (before commit)
- id: git-commit
  title:
    cs: Vytvořit commit
    en: Create commit
  tags:
    cs:
    - git
    - commit
    - add
    - uložit
    en:
    - git
    - commit
    - add
    - save
  commands:
  - cmd: git add .
    desc:
      cs: Přidat všechny změny do staging
      en: Stage all changes
  - cmd: git add -p
    desc:
      cs: Interaktivně, po blocích
      en: Interactive, hunk by hunk
  - cmd: git commit -m 'zpráva'
    desc:
      cs: Commit se zprávou
      en: Commit with message
  - cmd: git commit -am 'zpráva'
    desc:
      cs: Add tracked files + commit najednou
      en: Add tracked + commit at once
  - cmd: git commit --amend
    desc:
      cs: Upravit poslední commit
      en: Amend last commit
- id: git-branch
  title:
    cs: Větve (branches)
    en: Branches
  tags:
    cs:
    - git
    - branch
    - větev
    - checkout
    - switch
    en:
    - git
    - branch
    - checkout
    - switch
  commands:
  - cmd: git branch
    desc:
      cs: Seznam lokálních větví
      en: List local branches
  - cmd: git branch -a
    desc:
      cs: Včetně vzdálených
      en: Including remote
  - cmd: git switch -c nova-vetev
    desc:
      cs: Vytvořit a přepnout na novou větev
      en: Create and switch to new branch
  - cmd: git switch main
    desc:
      cs: Přepnout na main
      en: Switch to main
  - cmd: git branch -d nova-vetev
    desc:
      cs: Smazat lokální větev
      en: Delete local branch
- id: git-remote
  title:
    cs: Práce se vzdáleným repem
    en: Working with remote
  tags:
    cs:
    - git
    - remote
    - push
    - pull
    - fetch
    - clone
    - origin
    en:
    - git
    - remote
    - push
    - pull
    - fetch
    - clone
    - origin
  commands:
  - cmd: git clone https://github.com/user/repo.git
    desc:
      cs: Naklonovat repo
      en: Clone repo
  - cmd: git pull
    desc:
      cs: Stáhnout a sloučit změny
      en: Fetch and merge changes
  - cmd: git push
    desc:
      cs: Nahrát commity na server
      en: Push commits to server
  - cmd: git push -u origin nova-vetev
    desc:
      cs: Push nové větve + nastavit tracking
      en: Push new branch + set tracking
  - cmd: git fetch --all --prune
    desc:
      cs: Stáhnout změny + zahodit smazané větve
      en: Fetch + drop deleted branches
- id: git-log
  title:
    cs: Historie commitů
    en: Commit history
  tags:
    cs:
    - git
    - log
    - historie
    - history
    en:
    - git
    - log
    - history
  commands:
  - cmd: git log --oneline
    desc:
      cs: Stručný log (jeden řádek = commit)
      en: Brief log (one line per commit)
  - cmd: git log --oneline --graph --all
    desc:
      cs: ASCII graf všech větví
      en: ASCII graph of all branches
  - cmd: git log -p soubor.txt
    desc:
      cs: Historie změn konkrétního souboru
      en: Change history of specific file
  - cmd: git blame soubor.txt
    desc:
      cs: Kdo změnil který řádek
      en: Who changed which line
- id: git-undo
  title:
    cs: Vrátit změny
    en: Undo changes
  tags:
    cs:
    - git
    - undo
    - reset
    - revert
    - vrátit
    - stash
    en:
    - git
    - undo
    - reset
    - revert
    - stash
  commands:
  - cmd: git restore soubor.txt
    desc:
      cs: Zahodit neuložené změny v souboru
      en: Discard unstaged changes in file
  - cmd: git restore --staged soubor.txt
    desc:
      cs: Odebrat ze staging (ale ponechat změny)
      en: Unstage (keep changes)
  - cmd: git reset --hard HEAD
    desc:
      cs: 'POZOR: zahodit všechny lokální změny'
      en: 'WARNING: discard all local changes'
  - cmd: git revert <commit>
    desc:
      cs: Vytvořit commit, který ruší daný commit
      en: Create commit that undoes a commit
  - cmd: git stash
    desc:
      cs: Schovat změny stranou
      en: Stash changes aside
  - cmd: git stash pop
    desc:
      cs: Vrátit schované změny
      en: Apply stashed changes
