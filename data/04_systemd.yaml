- id: systemd-status
  title:
    cs: Stav služby
    en: Service status
  tags:
    cs:
    - systemd
    - služba
    - service
    - status
    - stav
    en:
    - systemd
    - service
    - status
  commands:
  - cmd: systemctl status nginx
    desc:
      cs: Stav konkrétní služby
      en: Status of specific service
  - cmd: systemctl is-active nginx
    desc:
      cs: Jen 'active' / 'inactive'
      en: Just 'active' / 'inactive'
  - cmd: systemctl is-enabled nginx
    desc:
      cs: Zapnuto po startu?
      en: Enabled on boot?
- id: systemd-control
  title:
    cs: Ovládat službu (start/stop/restart)
    en: Control service (start/stop/restart)
  tags:
    cs:
    - systemd
    - restart
    - start
    - stop
    - reload
    - služba
    en:
    - systemd
    - restart
    - start
    - stop
    - reload
    - service
  commands:
  - cmd: sudo systemctl start nginx
    desc:
      cs: Spustit
      en: Start
  - cmd: sudo systemctl stop nginx
    desc:
      cs: Zastavit
      en: Stop
  - cmd: sudo systemctl restart nginx
    desc:
      cs: Restartovat
      en: Restart
  - cmd: sudo systemctl reload nginx
    desc:
      cs: Znovu načíst konfiguraci (bez restartu)
      en: Reload config (without restart)
  - cmd: sudo systemctl enable --now nginx
    desc:
      cs: Spustit + zapnout po startu systému
      en: Start + enable on boot
  - cmd: sudo systemctl disable --now nginx
    desc:
      cs: Zastavit + vypnout po startu
      en: Stop + disable on boot
- id: systemd-list
  title:
    cs: Seznam služeb
    en: List services
  tags:
    cs:
    - systemd
    - seznam
    - služby
    - units
    - list
    en:
    - systemd
    - list
    - services
    - units
  commands:
  - cmd: systemctl list-units --type=service
    desc:
      cs: Všechny běžící služby
      en: All running services
  - cmd: systemctl list-units --type=service --state=failed
    desc:
      cs: Selhané služby
      en: Failed services
  - cmd: systemctl list-unit-files --state=enabled
    desc:
      cs: Co se spouští po startu
      en: What starts on boot
- id: systemd-logs
  title:
    cs: Logy ze systemd (journalctl)
    en: Systemd logs (journalctl)
  tags:
    cs:
    - logy
    - journalctl
    - journal
    - log
    - chyby
    en:
    - logs
    - journalctl
    - journal
    - errors
  commands:
  - cmd: journalctl -u nginx -n 100
    desc:
      cs: Posledních 100 řádků logu nginxu
      en: Last 100 lines of nginx log
  - cmd: journalctl -u nginx -f
    desc:
      cs: Sledovat živě (jako tail -f)
      en: Follow live (like tail -f)
  - cmd: journalctl --since '1 hour ago'
    desc:
      cs: Vše za poslední hodinu
      en: Everything from last hour
  - cmd: journalctl -p err -b
    desc:
      cs: Jen chyby od posledního bootu
      en: Only errors since last boot
  - cmd: journalctl --vacuum-time=7d
    desc:
      cs: Smazat logy starší než 7 dní
      en: Delete logs older than 7 days
