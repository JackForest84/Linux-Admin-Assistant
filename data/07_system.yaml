- id: sys-info
  title_cs: "Informace o systému"
  title_en: "System information"
  tags_cs: [systém, info, verze, kernel, uname, distribuce]
  tags_en: [system, info, version, kernel, uname, distro]
  commands:
    - cmd: "uname -a"
      desc_cs: "Kernel, architektura, hostname"
      desc_en: "Kernel, architecture, hostname"
    - cmd: "cat /etc/os-release"
      desc_cs: "Distribuce a verze"
      desc_en: "Distro and version"
    - cmd: "lsb_release -a"
      desc_cs: "Detail distribuce (apt install lsb-release)"
      desc_en: "Detailed distro info"
    - cmd: "hostnamectl"
      desc_cs: "Hostname + verze systému + kernel"
      desc_en: "Hostname + system version + kernel"
    - cmd: "uptime"
      desc_cs: "Jak dlouho systém běží + zátěž"
      desc_en: "How long system runs + load"

- id: sys-memory
  title_cs: "Paměť (RAM, swap)"
  title_en: "Memory (RAM, swap)"
  tags_cs: [paměť, ram, swap, memory, free]
  tags_en: [memory, ram, swap, free]
  commands:
    - cmd: "free -h"
      desc_cs: "Volná/použitá RAM a swap (lidsky čitelné)"
      desc_en: "Free/used RAM and swap (human-readable)"
    - cmd: "free -m"
      desc_cs: "V MB"
      desc_en: "In MB"
    - cmd: "cat /proc/meminfo"
      desc_cs: "Detailní info o paměti"
      desc_en: "Detailed memory info"
    - cmd: "sudo dmidecode -t memory | grep -E 'Size|Speed'"
      desc_cs: "Fyzické moduly RAM (na bare metalu)"
      desc_en: "Physical RAM modules (on bare metal)"

- id: sys-cpu
  title_cs: "CPU informace"
  title_en: "CPU information"
  tags_cs: [cpu, procesor, jádro, cores]
  tags_en: [cpu, processor, cores]
  commands:
    - cmd: "lscpu"
      desc_cs: "Souhrn CPU"
      desc_en: "CPU summary"
    - cmd: "nproc"
      desc_cs: "Počet jader"
      desc_en: "Number of cores"
    - cmd: "cat /proc/cpuinfo"
      desc_cs: "Detailní info o CPU"
      desc_en: "Detailed CPU info"

- id: sys-time
  title_cs: "Datum, čas, časové pásmo"
  title_en: "Date, time, timezone"
  tags_cs: [datum, čas, timezone, časové pásmo, ntp]
  tags_en: [date, time, timezone, ntp]
  commands:
    - cmd: "date"
      desc_cs: "Aktuální čas"
      desc_en: "Current time"
    - cmd: "timedatectl"
      desc_cs: "Čas + časové pásmo + NTP sync"
      desc_en: "Time + timezone + NTP sync"
    - cmd: "sudo timedatectl set-timezone Europe/Prague"
      desc_cs: "Nastavit časové pásmo na Prahu"
      desc_en: "Set timezone to Prague"
    - cmd: "sudo timedatectl set-ntp true"
      desc_cs: "Zapnout automatickou synchronizaci času"
      desc_en: "Enable automatic time sync"

- id: sys-reboot
  title_cs: "Restart / vypnutí systému"
  title_en: "Reboot / shutdown"
  tags_cs: [restart, reboot, shutdown, vypnout, vypnutí]
  tags_en: [reboot, shutdown, halt, poweroff]
  commands:
    - cmd: "sudo reboot"
      desc_cs: "Restart hned"
      desc_en: "Reboot now"
    - cmd: "sudo shutdown -h now"
      desc_cs: "Vypnout hned"
      desc_en: "Shutdown now"
    - cmd: "sudo shutdown -r +5 'Restart za 5 minut'"
      desc_cs: "Restart za 5 minut, s hláškou pro uživatele"
      desc_en: "Reboot in 5 min, with message"
    - cmd: "sudo shutdown -c"
      desc_cs: "Zrušit naplánovaný shutdown"
      desc_en: "Cancel scheduled shutdown"

- id: sys-users
  title_cs: "Uživatelé a skupiny"
  title_en: "Users and groups"
  tags_cs: [user, uživatel, adduser, useradd, skupina, group, sudo]
  tags_en: [user, adduser, useradd, group, sudo]
  commands:
    - cmd: "whoami"
      desc_cs: "Pod jakým uživatelem jsem"
      desc_en: "Current username"
    - cmd: "id"
      desc_cs: "UID, GID a skupiny"
      desc_en: "UID, GID and groups"
    - cmd: "sudo adduser pepa"
      desc_cs: "Přidat uživatele (interaktivně, s domovem)"
      desc_en: "Add user (interactively, with home)"
    - cmd: "sudo usermod -aG sudo pepa"
      desc_cs: "Přidat uživatele do skupiny sudo"
      desc_en: "Add user to sudo group"
    - cmd: "sudo deluser pepa"
      desc_cs: "Smazat uživatele"
      desc_en: "Delete user"
    - cmd: "groups pepa"
      desc_cs: "V jakých skupinách je uživatel"
      desc_en: "Which groups a user belongs to"
    - cmd: "sudo passwd pepa"
      desc_cs: "Změnit heslo uživateli"
      desc_en: "Change user's password"
