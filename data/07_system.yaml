- id: sys-info
  title:
    cs: Informace o systému
    en: System information
  tags:
    cs:
    - systém
    - info
    - verze
    - kernel
    - uname
    - distribuce
    en:
    - system
    - info
    - version
    - kernel
    - uname
    - distro
  commands:
  - cmd: uname -a
    desc:
      cs: Kernel, architektura, hostname
      en: Kernel, architecture, hostname
  - cmd: cat /etc/os-release
    desc:
      cs: Distribuce a verze
      en: Distro and version
  - cmd: lsb_release -a
    desc:
      cs: Detail distribuce (apt install lsb-release)
      en: Detailed distro info
  - cmd: hostnamectl
    desc:
      cs: Hostname + verze systému + kernel
      en: Hostname + system version + kernel
  - cmd: uptime
    desc:
      cs: Jak dlouho systém běží + zátěž
      en: How long system runs + load
- id: sys-memory
  title:
    cs: Paměť (RAM, swap)
    en: Memory (RAM, swap)
  tags:
    cs:
    - paměť
    - ram
    - swap
    - memory
    - free
    en:
    - memory
    - ram
    - swap
    - free
  commands:
  - cmd: free -h
    desc:
      cs: Volná/použitá RAM a swap (lidsky čitelné)
      en: Free/used RAM and swap (human-readable)
  - cmd: free -m
    desc:
      cs: V MB
      en: In MB
  - cmd: cat /proc/meminfo
    desc:
      cs: Detailní info o paměti
      en: Detailed memory info
  - cmd: sudo dmidecode -t memory | grep -E 'Size|Speed'
    desc:
      cs: Fyzické moduly RAM (na bare metalu)
      en: Physical RAM modules (on bare metal)
- id: sys-cpu
  title:
    cs: CPU informace
    en: CPU information
  tags:
    cs:
    - cpu
    - procesor
    - jádro
    - cores
    en:
    - cpu
    - processor
    - cores
  commands:
  - cmd: lscpu
    desc:
      cs: Souhrn CPU
      en: CPU summary
  - cmd: nproc
    desc:
      cs: Počet jader
      en: Number of cores
  - cmd: cat /proc/cpuinfo
    desc:
      cs: Detailní info o CPU
      en: Detailed CPU info
- id: sys-time
  title:
    cs: Datum, čas, časové pásmo
    en: Date, time, timezone
  tags:
    cs:
    - datum
    - čas
    - timezone
    - časové pásmo
    - ntp
    en:
    - date
    - time
    - timezone
    - ntp
  commands:
  - cmd: date
    desc:
      cs: Aktuální čas
      en: Current time
  - cmd: timedatectl
    desc:
      cs: Čas + časové pásmo + NTP sync
      en: Time + timezone + NTP sync
  - cmd: sudo timedatectl set-timezone Europe/Prague
    desc:
      cs: Nastavit časové pásmo na Prahu
      en: Set timezone to Prague
  - cmd: sudo timedatectl set-ntp true
    desc:
      cs: Zapnout automatickou synchronizaci času
      en: Enable automatic time sync
- id: sys-reboot
  title:
    cs: Restart / vypnutí systému
    en: Reboot / shutdown
  tags:
    cs:
    - restart
    - reboot
    - shutdown
    - vypnout
    - vypnutí
    en:
    - reboot
    - shutdown
    - halt
    - poweroff
  commands:
  - cmd: sudo reboot
    desc:
      cs: Restart hned
      en: Reboot now
  - cmd: sudo shutdown -h now
    desc:
      cs: Vypnout hned
      en: Shutdown now
  - cmd: sudo shutdown -r +5 'Restart za 5 minut'
    desc:
      cs: Restart za 5 minut, s hláškou pro uživatele
      en: Reboot in 5 min, with message
  - cmd: sudo shutdown -c
    desc:
      cs: Zrušit naplánovaný shutdown
      en: Cancel scheduled shutdown
- id: sys-users
  title:
    cs: Uživatelé a skupiny
    en: Users and groups
  tags:
    cs:
    - user
    - uživatel
    - adduser
    - useradd
    - skupina
    - group
    - sudo
    en:
    - user
    - adduser
    - useradd
    - group
    - sudo
  commands:
  - cmd: whoami
    desc:
      cs: Pod jakým uživatelem jsem
      en: Current username
  - cmd: id
    desc:
      cs: UID, GID a skupiny
      en: UID, GID and groups
  - cmd: sudo adduser pepa
    desc:
      cs: Přidat uživatele (interaktivně, s domovem)
      en: Add user (interactively, with home)
  - cmd: sudo usermod -aG sudo pepa
    desc:
      cs: Přidat uživatele do skupiny sudo
      en: Add user to sudo group
  - cmd: sudo deluser pepa
    desc:
      cs: Smazat uživatele
      en: Delete user
  - cmd: groups pepa
    desc:
      cs: V jakých skupinách je uživatel
      en: Which groups a user belongs to
  - cmd: sudo passwd pepa
    desc:
      cs: Změnit heslo uživateli
      en: Change user's password
