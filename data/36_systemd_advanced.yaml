- id: systemd-create
  title:
    cs: Vytvořit vlastní systemd službu
    en: Create custom systemd service
  tags:
    cs:
    - systemd
    - služba
    - vlastní
    - vytvořit
    - unit
    en:
    - systemd
    - service
    - custom
    - create
    - unit
  commands:
  - cmd: sudo nano /etc/systemd/system/mojeapp.service
    desc:
      cs: Vytvořit service unit
      en: Create service unit
  - cmd: sudo systemctl daemon-reload
    desc:
      cs: Po úpravě unit souboru - znovu načíst
      en: After editing unit file - reload
  - cmd: sudo systemctl enable --now mojeapp
    desc:
      cs: Zapnout + spustit
      en: Enable + start
  - cmd: systemctl cat mojeapp
    desc:
      cs: Vypsat obsah unit souboru
      en: Show unit file content
  - cmd: systemctl edit mojeapp
    desc:
      cs: Upravit (override drop-in)
      en: Edit (override drop-in)
  - cmd: systemctl show mojeapp
    desc:
      cs: Všechny vlastnosti služby
      en: All service properties
- id: systemd-deps
  title:
    cs: Systemd - závislosti a analýza
    en: Systemd - dependencies and analysis
  tags:
    cs:
    - systemd
    - závislosti
    - dependencies
    - boot
    - analyze
    en:
    - systemd
    - dependencies
    - boot
    - analyze
  commands:
  - cmd: systemctl list-dependencies nginx
    desc:
      cs: Strom závislostí služby
      en: Service dependency tree
  - cmd: systemd-analyze
    desc:
      cs: Jak dlouho trval start systému
      en: How long boot took
  - cmd: systemd-analyze blame
    desc:
      cs: Které služby zdržely boot
      en: Which services slowed boot
  - cmd: systemd-analyze critical-chain
    desc:
      cs: Kritická cesta startu
      en: Critical boot chain
  - cmd: systemctl --failed
    desc:
      cs: Které služby selhaly
      en: Which services failed
- id: systemd-target
  title:
    cs: Runlevel / target
    en: Runlevel / target
  tags:
    cs:
    - target
    - runlevel
    - multi-user
    - graphical
    - default
    en:
    - target
    - runlevel
    - multi-user
    - graphical
    - default
  commands:
  - cmd: systemctl get-default
    desc:
      cs: Výchozí target (multi-user / graphical)
      en: Default target
  - cmd: sudo systemctl set-default multi-user.target
    desc:
      cs: Bootovat bez GUI
      en: Boot without GUI
  - cmd: sudo systemctl set-default graphical.target
    desc:
      cs: Bootovat s GUI
      en: Boot with GUI
  - cmd: sudo systemctl isolate rescue.target
    desc:
      cs: Přepnout do rescue módu (single user)
      en: Switch to rescue mode (single user)
- id: pm2
  title:
    cs: PM2 (process manager pro Node.js)
    en: PM2 (Node.js process manager)
  tags:
    cs:
    - pm2
    - node
    - proces
    - manager
    - restart
    en:
    - pm2
    - node
    - process
    - manager
    - restart
  commands:
  - cmd: pm2 start app.js --name web
    desc:
      cs: Spustit aplikaci pod správou pm2
      en: Start app under pm2
  - cmd: pm2 list
    desc:
      cs: Seznam spravovaných procesů
      en: List managed processes
  - cmd: pm2 logs web
    desc:
      cs: Logy konkrétního procesu
      en: Logs of specific process
  - cmd: pm2 restart web
    desc:
      cs: Restart
      en: Restart
  - cmd: pm2 save
    desc:
      cs: Uložit aktuální seznam procesů
      en: Save current process list
  - cmd: pm2 startup
    desc:
      cs: Vygenerovat příkaz pro autostart po reboootu
      en: Generate autostart-on-boot command
