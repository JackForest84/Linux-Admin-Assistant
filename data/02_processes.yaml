- id: proc-list
  title_cs: "Seznam procesů"
  title_en: "List processes"
  tags_cs: [procesy, ps, běžící, top]
  tags_en: [processes, ps, running, top]
  commands:
    - cmd: "ps aux"
      desc_cs: "Všechny procesy se zatížením CPU a RAM"
      desc_en: "All processes with CPU and RAM usage"
    - cmd: "ps auxf"
      desc_cs: "Strom procesů (rodič → potomek)"
      desc_en: "Process tree (parent → child)"
    - cmd: "ps aux --sort=-%mem | head -10"
      desc_cs: "10 procesů s největší spotřebou RAM"
      desc_en: "Top 10 by RAM usage"
    - cmd: "ps aux --sort=-%cpu | head -10"
      desc_cs: "10 procesů s největší spotřebou CPU"
      desc_en: "Top 10 by CPU usage"

- id: proc-monitor
  title_cs: "Živé sledování procesů"
  title_en: "Live process monitor"
  tags_cs: [top, htop, monitor, sledování, živé]
  tags_en: [top, htop, monitor, live]
  commands:
    - cmd: "top"
      desc_cs: "Klasický monitor (q pro konec)"
      desc_en: "Classic monitor (q to quit)"
    - cmd: "htop"
      desc_cs: "Lepší interaktivní monitor (apt install htop)"
      desc_en: "Better interactive monitor"
    - cmd: "watch -n 1 'ps aux --sort=-%cpu | head'"
      desc_cs: "Aktualizace TOP procesů každou vteřinu"
      desc_en: "Refresh top processes every second"

- id: proc-find
  title_cs: "Najít proces podle jména"
  title_en: "Find process by name"
  tags_cs: [pgrep, pidof, najít, proces, hledat]
  tags_en: [pgrep, pidof, find, process]
  commands:
    - cmd: "pgrep -a nginx"
      desc_cs: "PID + příkaz pro proces 'nginx'"
      desc_en: "PID + command for 'nginx' processes"
    - cmd: "pidof sshd"
      desc_cs: "Jen PID daného procesu"
      desc_en: "Only PID of given process"
    - cmd: "ps -ef | grep -v grep | grep nginx"
      desc_cs: "Klasický grep přístup"
      desc_en: "Classic grep approach"

- id: proc-kill
  title_cs: "Ukončit proces"
  title_en: "Kill process"
  tags_cs: [kill, killall, ukončit, zabít, pkill]
  tags_en: [kill, killall, terminate, pkill]
  commands:
    - cmd: "kill 1234"
      desc_cs: "Slušné ukončení (SIGTERM) procesu s PID 1234"
      desc_en: "Graceful kill (SIGTERM) of PID 1234"
    - cmd: "kill -9 1234"
      desc_cs: "Tvrdé ukončení (SIGKILL)"
      desc_en: "Force kill (SIGKILL)"
    - cmd: "pkill -f nginx"
      desc_cs: "Ukončit všechny procesy obsahující 'nginx'"
      desc_en: "Kill all processes matching 'nginx'"
    - cmd: "killall nginx"
      desc_cs: "Ukončit podle přesného jména"
      desc_en: "Kill by exact name"
