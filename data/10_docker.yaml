- id: docker-ps
  title:
    cs: Běžící kontejnery
    en: Running containers
  tags:
    cs:
    - docker
    - kontejner
    - ps
    - běžící
    en:
    - docker
    - container
    - ps
    - running
  commands:
  - cmd: docker ps
    desc:
      cs: Běžící kontejnery
      en: Running containers
  - cmd: docker ps -a
    desc:
      cs: Včetně zastavených
      en: Including stopped
  - cmd: docker ps -q
    desc:
      cs: Jen ID (pro skripty)
      en: Only IDs (for scripts)
  - cmd: docker stats
    desc:
      cs: Živý monitor CPU/RAM/IO kontejnerů
      en: Live CPU/RAM/IO monitor
- id: docker-run
  title:
    cs: Spustit kontejner
    en: Run container
  tags:
    cs:
    - docker
    - run
    - spustit
    - kontejner
    en:
    - docker
    - run
    - start
    - container
  commands:
  - cmd: docker run -d --name web -p 80:80 nginx
    desc:
      cs: Nginx na pozadí, port 80 → 80
      en: Nginx in background, port 80 → 80
  - cmd: docker run -it ubuntu bash
    desc:
      cs: Interaktivní shell v Ubuntu
      en: Interactive shell in Ubuntu
  - cmd: docker run --rm -v $(pwd):/data alpine ls /data
    desc:
      cs: Jednorázový kontejner s mountem
      en: One-shot container with mount
  - cmd: docker start kontejner
    desc:
      cs: Spustit zastavený kontejner
      en: Start stopped container
  - cmd: docker stop kontejner
    desc:
      cs: Slušně zastavit
      en: Stop gracefully
  - cmd: docker restart kontejner
    desc:
      cs: Restartovat
      en: Restart
- id: docker-logs-exec
  title:
    cs: Logy a shell v kontejneru
    en: Logs and shell in container
  tags:
    cs:
    - docker
    - logs
    - exec
    - shell
    - bash
    - kontejner
    en:
    - docker
    - logs
    - exec
    - shell
    - bash
  commands:
  - cmd: docker logs -f kontejner
    desc:
      cs: Sledovat logy živě
      en: Follow logs live
  - cmd: docker logs --tail 100 kontejner
    desc:
      cs: Posledních 100 řádků
      en: Last 100 lines
  - cmd: docker exec -it kontejner bash
    desc:
      cs: Otevřít bash uvnitř běžícího kontejneru
      en: Open bash inside running container
  - cmd: docker exec -it kontejner sh
    desc:
      cs: Pokud bash chybí (Alpine)
      en: If bash missing (Alpine)
  - cmd: docker inspect kontejner
    desc:
      cs: Detail (sítě, mounty, env)
      en: Details (networks, mounts, env)
- id: docker-images
  title:
    cs: Obrazy (images)
    en: Images
  tags:
    cs:
    - docker
    - image
    - obraz
    - pull
    - push
    - build
    en:
    - docker
    - image
    - pull
    - push
    - build
  commands:
  - cmd: docker images
    desc:
      cs: Seznam stažených obrazů
      en: List of downloaded images
  - cmd: docker pull nginx:alpine
    desc:
      cs: Stáhnout obraz
      en: Pull image
  - cmd: docker build -t mojeapp:1.0 .
    desc:
      cs: Sestavit obraz z Dockerfile
      en: Build image from Dockerfile
  - cmd: docker rmi nginx:alpine
    desc:
      cs: Smazat obraz
      en: Remove image
  - cmd: docker image prune -a
    desc:
      cs: Smazat všechny nepoužívané obrazy
      en: Remove all unused images
- id: docker-cleanup
  title:
    cs: Úklid (volné místo)
    en: Cleanup (free space)
  tags:
    cs:
    - docker
    - prune
    - úklid
    - smazat
    - místo
    - cleanup
    en:
    - docker
    - prune
    - cleanup
    - remove
    - space
  commands:
  - cmd: docker system df
    desc:
      cs: Kolik místa zabírá Docker
      en: How much space Docker uses
  - cmd: docker system prune -a --volumes
    desc:
      cs: Smazat vše nepoužívané (POZOR i volumes)
      en: Remove everything unused (CAREFUL — volumes too)
  - cmd: docker container prune
    desc:
      cs: Smazat zastavené kontejnery
      en: Remove stopped containers
  - cmd: docker volume prune
    desc:
      cs: Smazat nepoužívané volumes
      en: Remove unused volumes
- id: docker-compose
  title:
    cs: Docker Compose
    en: Docker Compose
  tags:
    cs:
    - docker
    - compose
    - yaml
    - stack
    en:
    - docker
    - compose
    - yaml
    - stack
  commands:
  - cmd: docker compose up -d
    desc:
      cs: Spustit vše z docker-compose.yml na pozadí
      en: Start everything from docker-compose.yml in background
  - cmd: docker compose down
    desc:
      cs: Zastavit + odstranit kontejnery
      en: Stop + remove containers
  - cmd: docker compose logs -f web
    desc:
      cs: Logy služby 'web' živě
      en: Follow logs of service 'web'
  - cmd: docker compose pull && docker compose up -d
    desc:
      cs: Aktualizovat obrazy a restartovat
      en: Update images and restart
  - cmd: docker compose ps
    desc:
      cs: Stav služeb
      en: Services status
  - cmd: docker compose restart web
    desc:
      cs: Restartovat jen jednu službu
      en: Restart only one service
