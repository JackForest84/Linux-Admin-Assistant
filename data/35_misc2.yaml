- id: dialog
  title:
    cs: Interaktivní dialogy ve skriptech
    en: Interactive script dialogs
  tags:
    cs:
    - dialog
    - whiptail
    - read
    - otázka
    - interaktivní
    en:
    - dialog
    - whiptail
    - read
    - prompt
    - interactive
  commands:
  - cmd: 'read -p ''Tvé jméno: '' jmeno && echo "Ahoj $jmeno"'
    desc:
      cs: Zeptat se uživatele na vstup
      en: Ask user for input
  - cmd: 'read -s -p ''Heslo: '' heslo'
    desc:
      cs: Vstup bez echování (heslo)
      en: Hidden input (password)
  - cmd: whiptail --yesno 'Pokračovat?' 10 40
    desc:
      cs: Ano/Ne dialog (apt install whiptail)
      en: Yes/No dialog
  - cmd: whiptail --inputbox 'Jméno?' 10 40 'výchozí'
    desc:
      cs: Textový dialog s výchozí hodnotou
      en: Text input with default
  - cmd: select s in a b c quit; do echo $s; [ $s = quit ] && break; done
    desc:
      cs: Bash menu výběr
      en: Bash select menu
- id: ssl-test
  title:
    cs: Test webů a SSL
    en: Test websites and SSL
  tags:
    cs:
    - ssl
    - test
    - https
    - curl
    - openssl
    - web
    en:
    - ssl
    - test
    - https
    - curl
    - openssl
    - web
  commands:
  - cmd: curl -vI https://example.com 2>&1 | grep -i 'subject\|expire'
    desc:
      cs: Info o cert. webu
      en: Web cert info
  - cmd: openssl s_client -connect example.com:443 -servername example.com
    desc:
      cs: Plné spojení (SNI)
      en: Full connection (SNI)
  - cmd: nmap --script ssl-cert -p 443 example.com
    desc:
      cs: SSL cert přes nmap
      en: SSL cert via nmap
- id: nmap
  title:
    cs: nmap - sken sítě
    en: nmap - network scan
  tags:
    cs:
    - nmap
    - sken
    - porty
    - síť
    - security
    en:
    - nmap
    - scan
    - ports
    - network
    - security
  commands:
  - cmd: nmap 192.168.1.0/24
    desc:
      cs: Najít aktivní zařízení v síti
      en: Find active devices in network
  - cmd: nmap -sn 192.168.1.0/24
    desc:
      cs: Jen ping sken (rychlejší)
      en: Ping scan only (faster)
  - cmd: sudo nmap -sS -p 1-1000 192.168.1.10
    desc:
      cs: Sken portů 1-1000 (SYN scan)
      en: Port scan 1-1000 (SYN scan)
  - cmd: nmap -A 192.168.1.10
    desc:
      cs: Agresivní sken (OS, verze, skripty)
      en: Aggressive scan (OS, version, scripts)
  - cmd: nmap -p- 192.168.1.10
    desc:
      cs: Všechny porty (1-65535)
      en: All ports (1-65535)
- id: zip-advanced
  title:
    cs: 7zip a další komprese
    en: 7zip and other compression
  tags:
    cs:
    - 7zip
    - 7z
    - gzip
    - bzip2
    - xz
    - komprese
    en:
    - 7zip
    - 7z
    - gzip
    - bzip2
    - xz
    - compression
  commands:
  - cmd: 7z a archiv.7z slozka/
    desc:
      cs: Vytvořit 7z archív (vysoká komprese)
      en: Create 7z archive (high compression)
  - cmd: 7z x archiv.7z
    desc:
      cs: Rozbalit
      en: Extract
  - cmd: 7z a -p archiv.7z soubor
    desc:
      cs: Zaheslovaný archív
      en: Password-protected archive
  - cmd: gzip soubor.txt
    desc:
      cs: Zkomprimovat (vytvoří .gz, smaže originál)
      en: Compress (creates .gz, removes original)
  - cmd: gunzip soubor.txt.gz
    desc:
      cs: Dekomprimovat
      en: Decompress
  - cmd: zcat soubor.txt.gz
    desc:
      cs: Vypsat obsah .gz bez rozbalení
      en: Show .gz content without extracting
- id: cmd-chaining
  title:
    cs: Řetězení příkazů
    en: Chaining commands
  tags:
    cs:
    - chaining
    - řetězení
    - sekvence
    - and
    - or
    en:
    - chaining
    - sequence
    - and
    - or
  commands:
  - cmd: prikaz1 && prikaz2
    desc:
      cs: Spustit prikaz2 jen pokud prikaz1 uspěl
      en: Run prikaz2 only if prikaz1 succeeded
  - cmd: prikaz1 || prikaz2
    desc:
      cs: Spustit prikaz2 jen pokud prikaz1 selhal
      en: Run prikaz2 only if prikaz1 failed
  - cmd: prikaz1 ; prikaz2
    desc:
      cs: Spustit oba bez ohledu na výsledek
      en: Run both regardless of result
  - cmd: prikaz1 & prikaz2
    desc:
      cs: Prikaz1 na pozadí + hned prikaz2
      en: Prikaz1 in background + prikaz2 immediately
  - cmd: '{ prikaz1; prikaz2; } > out.txt'
    desc:
      cs: Skupina příkazů - společný výstup
      en: Command group - shared output
- id: bash-string
  title:
    cs: Bash - manipulace s řetězci
    en: Bash - string manipulation
  tags:
    cs:
    - bash
    - řetězec
    - string
    - manipulace
    - substituce
    en:
    - bash
    - string
    - manipulation
    - substitution
  commands:
  - cmd: echo ${#retezec}
    desc:
      cs: Délka řetězce
      en: String length
  - cmd: echo ${retezec:0:5}
    desc:
      cs: Substring (od 0, délka 5)
      en: Substring (from 0, length 5)
  - cmd: echo ${retezec/staré/nové}
    desc:
      cs: Nahradit první výskyt
      en: Replace first occurrence
  - cmd: echo ${retezec//staré/nové}
    desc:
      cs: Nahradit všechny výskyty
      en: Replace all occurrences
  - cmd: echo ${retezec,,}
    desc:
      cs: Na malá písmena
      en: To lowercase
  - cmd: echo ${retezec^^}
    desc:
      cs: Na velká písmena
      en: To uppercase
  - cmd: basename /cesta/k/souboru.txt
    desc:
      cs: Jen název souboru
      en: Just filename
  - cmd: dirname /cesta/k/souboru.txt
    desc:
      cs: Jen cesta
      en: Just directory
