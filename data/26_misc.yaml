- id: date-time
  title:
    cs: Datum a čas v shellu
    en: Date and time in shell
  tags:
    cs:
    - date
    - datum
    - čas
    - timestamp
    - formát
    en:
    - date
    - time
    - timestamp
    - format
  commands:
  - cmd: date '+%Y-%m-%d %H:%M:%S'
    desc:
      cs: ISO formát
      en: ISO format
  - cmd: date +%s
    desc:
      cs: Unix timestamp
      en: Unix timestamp
  - cmd: date -d '@1700000000'
    desc:
      cs: Převést timestamp na datum
      en: Convert timestamp to date
  - cmd: date -d 'tomorrow'
    desc:
      cs: Zítřejší datum
      en: Tomorrow's date
  - cmd: date -d '7 days ago' +%Y-%m-%d
    desc:
      cs: Datum 7 dní zpět
      en: Date 7 days ago
  - cmd: cal
    desc:
      cs: Kalendář aktuálního měsíce
      en: Current month calendar
- id: terminal-tricks
  title:
    cs: Triky v terminálu
    en: Terminal tricks
  tags:
    cs:
    - terminál
    - klávesy
    - zkratky
    - clear
    - ctrl
    en:
    - terminal
    - keys
    - shortcuts
    - clear
    - ctrl
  commands:
  - cmd: Ctrl+C
    desc:
      cs: Přerušit běžící příkaz
      en: Interrupt running command
  - cmd: Ctrl+D
    desc:
      cs: Konec vstupu / odhlásit
      en: End of input / logout
  - cmd: Ctrl+Z
    desc:
      cs: Pozastavit příkaz (bg / fg pro obnovu)
      en: Suspend command (bg / fg to resume)
  - cmd: Ctrl+L
    desc:
      cs: Vyčistit obrazovku
      en: Clear screen
  - cmd: Ctrl+A
    desc:
      cs: Na začátek řádku
      en: Start of line
  - cmd: Ctrl+E
    desc:
      cs: Na konec řádku
      en: End of line
  - cmd: Ctrl+U
    desc:
      cs: Vymazat řádek doleva
      en: Clear line to left
  - cmd: Ctrl+W
    desc:
      cs: Smazat slovo doleva
      en: Delete word to left
  - cmd: clear
    desc:
      cs: Vyčistit obrazovku (jako Ctrl+L)
      en: Clear screen (like Ctrl+L)
  - cmd: reset
    desc:
      cs: Reset terminálu (když se rozbije)
      en: Reset terminal (when broken)
- id: bg-jobs
  title:
    cs: Procesy na pozadí
    en: Background processes
  tags:
    cs:
    - pozadí
    - background
    - nohup
    - jobs
    - fg
    - bg
    en:
    - background
    - nohup
    - jobs
    - fg
    - bg
  commands:
  - cmd: prikaz &
    desc:
      cs: Spustit na pozadí
      en: Run in background
  - cmd: jobs
    desc:
      cs: Seznam jobů této session
      en: List jobs of this session
  - cmd: fg %1
    desc:
      cs: Přenést job 1 do popředí
      en: Bring job 1 to foreground
  - cmd: bg %1
    desc:
      cs: Pokračovat v běhu na pozadí
      en: Resume in background
  - cmd: nohup dlouhy-prikaz &
    desc:
      cs: Spustit + nezavřít po odhlášení
      en: Run + survive logout
  - cmd: disown %1
    desc:
      cs: Odpojit job od shellu
      en: Detach job from shell
- id: which-info
  title:
    cs: Kde je příkaz, co dělá
    en: Where is command, what it does
  tags:
    cs:
    - which
    - whereis
    - man
    - info
    - help
    - nápověda
    en:
    - which
    - whereis
    - man
    - info
    - help
  commands:
  - cmd: which git
    desc:
      cs: Cesta k binárce
      en: Path to binary
  - cmd: whereis git
    desc:
      cs: Cesta + man stránka + zdrojáky
      en: Path + man page + sources
  - cmd: man ls
    desc:
      cs: Manuál (q pro konec)
      en: Manual (q to quit)
  - cmd: man -k 'klíčové slovo'
    desc:
      cs: Najít man stránku podle slova
      en: Find man page by keyword
  - cmd: ls --help
    desc:
      cs: Stručná nápověda
      en: Brief help
  - cmd: info ls
    desc:
      cs: Info dokumentace (rozsáhlejší než man)
      en: Info docs (more detailed than man)
  - cmd: tldr tar
    desc:
      cs: Praktické příklady místo manuálu (npm/apt install tldr)
      en: Practical examples instead of manual
- id: links
  title:
    cs: Symbolické a tvrdé linky
    en: Symbolic and hard links
  tags:
    cs:
    - ln
    - link
    - odkaz
    - symlink
    - soft
    - hard
    en:
    - ln
    - link
    - symlink
    - soft
    - hard
  commands:
  - cmd: ln -s /opt/aplikace /usr/local/bin/aplikace
    desc:
      cs: Symbolický link (symlink, jako zástupce)
      en: Symbolic link (symlink)
  - cmd: ln /zdroj /cil
    desc:
      cs: Tvrdý link (na stejný inode)
      en: Hard link (same inode)
  - cmd: readlink -f soubor
    desc:
      cs: Kam ukazuje symlink (s rozbalením)
      en: Where does symlink point (resolved)
  - cmd: ls -la | grep '^l'
    desc:
      cs: Jen symlinky v adresáři
      en: Only symlinks in directory
- id: env-shell
  title:
    cs: Konfigurace shellu
    en: Shell configuration
  tags:
    cs:
    - bashrc
    - zshrc
    - profile
    - shell
    - prompt
    en:
    - bashrc
    - zshrc
    - profile
    - shell
    - prompt
  commands:
  - cmd: source ~/.bashrc
    desc:
      cs: Znovu načíst bashrc
      en: Reload bashrc
  - cmd: echo $SHELL
    desc:
      cs: Aktuální shell (přihlašovací)
      en: Current shell (login)
  - cmd: chsh -s /bin/zsh
    desc:
      cs: Změnit výchozí shell na zsh
      en: Change default shell to zsh
  - cmd: echo $PATH | tr ':' '\n'
    desc:
      cs: Vypsat PATH po řádcích
      en: Print PATH line by line
  - cmd: export PATH=$PATH:/opt/bin
    desc:
      cs: Přidat adresář do PATH (jen pro session)
      en: Add directory to PATH (session only)
