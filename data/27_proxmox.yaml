- id: pct-lxc
  title:
    cs: Proxmox - LXC kontejnery (pct)
    en: Proxmox - LXC containers (pct)
  tags:
    cs:
    - proxmox
    - pct
    - lxc
    - kontejner
    en:
    - proxmox
    - pct
    - lxc
    - container
  commands:
  - cmd: pct list
    desc:
      cs: Seznam všech LXC kontejnerů
      en: List all LXC containers
  - cmd: pct start 100
    desc:
      cs: Spustit CT s ID 100
      en: Start CT with ID 100
  - cmd: pct stop 100
    desc:
      cs: Zastavit CT
      en: Stop CT
  - cmd: pct enter 100
    desc:
      cs: Vstoupit do shellu kontejneru (jako root)
      en: Enter container shell (as root)
  - cmd: pct exec 100 -- uptime
    desc:
      cs: Spustit příkaz uvnitř CT
      en: Run command inside CT
  - cmd: pct destroy 100
    desc:
      cs: Smazat CT (musí být zastaven)
      en: Destroy CT (must be stopped)
  - cmd: pct config 100
    desc:
      cs: Konfigurace CT
      en: CT configuration
  - cmd: pct snapshot 100 pred-zalohou
    desc:
      cs: Vytvořit snapshot
      en: Create snapshot
  - cmd: pct rollback 100 pred-zalohou
    desc:
      cs: Obnovit ze snapshotu
      en: Rollback to snapshot
- id: qm-vm
  title:
    cs: Proxmox - virtuální stroje (qm)
    en: Proxmox - virtual machines (qm)
  tags:
    cs:
    - proxmox
    - qm
    - vm
    - virtuální
    en:
    - proxmox
    - qm
    - vm
    - virtual
  commands:
  - cmd: qm list
    desc:
      cs: Seznam VM
      en: List VMs
  - cmd: qm start 200
    desc:
      cs: Spustit VM
      en: Start VM
  - cmd: qm shutdown 200
    desc:
      cs: Slušně vypnout
      en: Shutdown gracefully
  - cmd: qm stop 200
    desc:
      cs: Tvrdé zastavení
      en: Force stop
  - cmd: qm migrate 200 node2 --online
    desc:
      cs: Migrace VM za běhu
      en: Live migrate VM
  - cmd: qm config 200
    desc:
      cs: Konfigurace VM
      en: VM configuration
- id: pve-cluster
  title:
    cs: Proxmox - cluster a uzly
    en: Proxmox - cluster and nodes
  tags:
    cs:
    - proxmox
    - cluster
    - node
    - uzel
    - status
    en:
    - proxmox
    - cluster
    - node
    - status
  commands:
  - cmd: pvecm status
    desc:
      cs: Stav clusteru
      en: Cluster status
  - cmd: pvecm nodes
    desc:
      cs: Seznam uzlů
      en: List nodes
  - cmd: pveversion
    desc:
      cs: Verze Proxmox VE
      en: Proxmox VE version
  - cmd: pvesh get /nodes
    desc:
      cs: Stav uzlů přes API
      en: Node status via API
  - cmd: ha-manager status
    desc:
      cs: Stav High Availability
      en: HA status
- id: pve-backup
  title:
    cs: Proxmox - zálohy (vzdump)
    en: Proxmox - backups (vzdump)
  tags:
    cs:
    - proxmox
    - záloha
    - backup
    - vzdump
    - restore
    en:
    - proxmox
    - backup
    - vzdump
    - restore
  commands:
  - cmd: vzdump 100 --storage local --compress zstd
    desc:
      cs: Zálohovat CT 100
      en: Backup CT 100
  - cmd: vzdump --all --storage local
    desc:
      cs: Zálohovat všechny VM/CT
      en: Backup all VMs/CTs
  - cmd: pct restore 101 /var/lib/vz/dump/vzdump-lxc-100-*.tar.zst
    desc:
      cs: Obnovit CT pod novým ID
      en: Restore CT under new ID
