- id: bash-history
  title_cs: "Historie příkazů"
  title_en: "Command history"
  tags_cs: [history, historie, bash, příkaz, opakovat]
  tags_en: [history, bash, command, repeat]
  commands:
    - cmd: "history"
      desc_cs: "Všechny příkazy z historie"
      desc_en: "All commands from history"
    - cmd: "history | grep ssh"
      desc_cs: "Najít v historii"
      desc_en: "Search history"
    - cmd: "!42"
      desc_cs: "Spustit příkaz č. 42 z historie"
      desc_en: "Run command #42 from history"
    - cmd: "!!"
      desc_cs: "Zopakovat poslední příkaz"
      desc_en: "Repeat last command"
    - cmd: "sudo !!"
      desc_cs: "Zopakovat poslední příkaz s sudo"
      desc_en: "Repeat last command with sudo"
    - cmd: "Ctrl+R"
      desc_cs: "Reverse search v historii (interaktivně)"
      desc_en: "Reverse search in history (interactive)"

- id: bash-redirect
  title_cs: "Přesměrování a roury"
  title_en: "Redirection and pipes"
  tags_cs: [redirect, pipe, roura, přesměrování, stdout, stderr]
  tags_en: [redirect, pipe, stdout, stderr]
  commands:
    - cmd: "prikaz > soubor.txt"
      desc_cs: "Zapsat výstup do souboru (přepsat)"
      desc_en: "Write output to file (overwrite)"
    - cmd: "prikaz >> soubor.txt"
      desc_cs: "Přidat na konec souboru"
      desc_en: "Append to file"
    - cmd: "prikaz 2> chyby.txt"
      desc_cs: "Přesměrovat jen chyby (stderr)"
      desc_en: "Redirect only errors (stderr)"
    - cmd: "prikaz > vse.txt 2>&1"
      desc_cs: "Stdout i stderr do jednoho souboru"
      desc_en: "Both stdout and stderr to one file"
    - cmd: "prikaz &> vse.txt"
      desc_cs: "Stejné, zkrácený zápis"
      desc_en: "Same, shorter syntax"
    - cmd: "prikaz1 | prikaz2"
      desc_cs: "Roura: výstup 1 → vstup 2"
      desc_en: "Pipe: output of 1 → input of 2"
    - cmd: "prikaz | tee soubor.txt"
      desc_cs: "Vypsat na obrazovku i do souboru"
      desc_en: "Show on screen and save to file"

- id: bash-vars
  title_cs: "Proměnné a aliasy"
  title_en: "Variables and aliases"
  tags_cs: [proměnná, variable, export, alias, env]
  tags_en: [variable, export, alias, env]
  commands:
    - cmd: "export MY_VAR='hodnota'"
      desc_cs: "Nastavit proměnnou pro tuto session"
      desc_en: "Set variable for this session"
    - cmd: "echo $MY_VAR"
      desc_cs: "Vypsat hodnotu proměnné"
      desc_en: "Print variable value"
    - cmd: "env"
      desc_cs: "Všechny proměnné prostředí"
      desc_en: "All environment variables"
    - cmd: "alias ll='ls -lah'"
      desc_cs: "Vytvořit alias"
      desc_en: "Create alias"
    - cmd: "unalias ll"
      desc_cs: "Smazat alias"
      desc_en: "Remove alias"
    - cmd: "echo 'alias ll=\"ls -lah\"' >> ~/.bashrc"
      desc_cs: "Trvalý alias"
      desc_en: "Permanent alias"

- id: bash-loops
  title_cs: "Smyčky a podmínky"
  title_en: "Loops and conditions"
  tags_cs: [for, while, if, smyčka, podmínka, bash]
  tags_en: [for, while, if, loop, condition, bash]
  commands:
    - cmd: "for f in *.txt; do echo $f; done"
      desc_cs: "Iterovat přes soubory"
      desc_en: "Iterate over files"
    - cmd: "for i in {1..10}; do echo $i; done"
      desc_cs: "Od 1 do 10"
      desc_en: "From 1 to 10"
    - cmd: "while read line; do echo $line; done < soubor.txt"
      desc_cs: "Číst soubor po řádcích"
      desc_en: "Read file line by line"
    - cmd: "if [ -f soubor ]; then echo 'existuje'; fi"
      desc_cs: "Test existence souboru"
      desc_en: "Test if file exists"
    - cmd: "[ -d /opt ] && echo 'existuje'"
      desc_cs: "Test adresáře, jednořádkově"
      desc_en: "Test directory, one-liner"

- id: bash-misc
  title_cs: "Užitečné triky"
  title_en: "Useful tricks"
  tags_cs: [bash, triky, xargs, watch, time, sleep]
  tags_en: [bash, tricks, xargs, watch, time, sleep]
  commands:
    - cmd: "xargs -I {} cp {} /backup/ < seznam.txt"
      desc_cs: "Spustit příkaz pro každý řádek vstupu"
      desc_en: "Run command for each input line"
    - cmd: "find . -name '*.log' | xargs rm"
      desc_cs: "Smazat všechny .log soubory"
      desc_en: "Delete all .log files"
    - cmd: "watch -n 2 'df -h'"
      desc_cs: "Spouštět příkaz každé 2 vteřiny"
      desc_en: "Run command every 2 seconds"
    - cmd: "time prikaz"
      desc_cs: "Změřit, jak dlouho příkaz trval"
      desc_en: "Measure how long command took"
    - cmd: "sleep 5 && echo 'hotovo'"
      desc_cs: "Počkat 5 vteřin a něco udělat"
      desc_en: "Wait 5 seconds and do something"
    - cmd: "yes | sudo apt remove balicek"
      desc_cs: "Automaticky odpovídat 'y' na otázky"
      desc_en: "Automatically answer 'y' to prompts"
    - cmd: "command -v git"
      desc_cs: "Je tento příkaz nainstalovaný?"
      desc_en: "Is this command installed?"
    - cmd: "type ls"
      desc_cs: "Co je za 'ls' (alias/binární/funkce)?"
      desc_en: "What is 'ls' (alias/binary/function)?"
