- id: bash-history
  title:
    cs: Historie příkazů
    en: Command history
  tags:
    cs:
    - history
    - historie
    - bash
    - příkaz
    - opakovat
    en:
    - history
    - bash
    - command
    - repeat
  commands:
  - cmd: history
    desc:
      cs: Všechny příkazy z historie
      en: All commands from history
  - cmd: history | grep ssh
    desc:
      cs: Najít v historii
      en: Search history
  - cmd: '!42'
    desc:
      cs: Spustit příkaz č. 42 z historie
      en: 'Run command #42 from history'
  - cmd: '!!'
    desc:
      cs: Zopakovat poslední příkaz
      en: Repeat last command
  - cmd: sudo !!
    desc:
      cs: Zopakovat poslední příkaz s sudo
      en: Repeat last command with sudo
  - cmd: Ctrl+R
    desc:
      cs: Reverse search v historii (interaktivně)
      en: Reverse search in history (interactive)
- id: bash-redirect
  title:
    cs: Přesměrování a roury
    en: Redirection and pipes
  tags:
    cs:
    - redirect
    - pipe
    - roura
    - přesměrování
    - stdout
    - stderr
    en:
    - redirect
    - pipe
    - stdout
    - stderr
  commands:
  - cmd: prikaz > soubor.txt
    desc:
      cs: Zapsat výstup do souboru (přepsat)
      en: Write output to file (overwrite)
  - cmd: prikaz >> soubor.txt
    desc:
      cs: Přidat na konec souboru
      en: Append to file
  - cmd: prikaz 2> chyby.txt
    desc:
      cs: Přesměrovat jen chyby (stderr)
      en: Redirect only errors (stderr)
  - cmd: prikaz > vse.txt 2>&1
    desc:
      cs: Stdout i stderr do jednoho souboru
      en: Both stdout and stderr to one file
  - cmd: prikaz &> vse.txt
    desc:
      cs: Stejné, zkrácený zápis
      en: Same, shorter syntax
  - cmd: prikaz1 | prikaz2
    desc:
      cs: 'Roura: výstup 1 → vstup 2'
      en: 'Pipe: output of 1 → input of 2'
  - cmd: prikaz | tee soubor.txt
    desc:
      cs: Vypsat na obrazovku i do souboru
      en: Show on screen and save to file
- id: bash-vars
  title:
    cs: Proměnné a aliasy
    en: Variables and aliases
  tags:
    cs:
    - proměnná
    - variable
    - export
    - alias
    - env
    en:
    - variable
    - export
    - alias
    - env
  commands:
  - cmd: export MY_VAR='hodnota'
    desc:
      cs: Nastavit proměnnou pro tuto session
      en: Set variable for this session
  - cmd: echo $MY_VAR
    desc:
      cs: Vypsat hodnotu proměnné
      en: Print variable value
  - cmd: env
    desc:
      cs: Všechny proměnné prostředí
      en: All environment variables
  - cmd: alias ll='ls -lah'
    desc:
      cs: Vytvořit alias
      en: Create alias
  - cmd: unalias ll
    desc:
      cs: Smazat alias
      en: Remove alias
  - cmd: echo 'alias ll="ls -lah"' >> ~/.bashrc
    desc:
      cs: Trvalý alias
      en: Permanent alias
- id: bash-loops
  title:
    cs: Smyčky a podmínky
    en: Loops and conditions
  tags:
    cs:
    - for
    - while
    - if
    - smyčka
    - podmínka
    - bash
    en:
    - for
    - while
    - if
    - loop
    - condition
    - bash
  commands:
  - cmd: for f in *.txt; do echo $f; done
    desc:
      cs: Iterovat přes soubory
      en: Iterate over files
  - cmd: for i in {1..10}; do echo $i; done
    desc:
      cs: Od 1 do 10
      en: From 1 to 10
  - cmd: while read line; do echo $line; done < soubor.txt
    desc:
      cs: Číst soubor po řádcích
      en: Read file line by line
  - cmd: if [ -f soubor ]; then echo 'existuje'; fi
    desc:
      cs: Test existence souboru
      en: Test if file exists
  - cmd: '[ -d /opt ] && echo ''existuje'''
    desc:
      cs: Test adresáře, jednořádkově
      en: Test directory, one-liner
- id: bash-misc
  title:
    cs: Užitečné triky
    en: Useful tricks
  tags:
    cs:
    - bash
    - triky
    - xargs
    - watch
    - time
    - sleep
    en:
    - bash
    - tricks
    - xargs
    - watch
    - time
    - sleep
  commands:
  - cmd: xargs -I {} cp {} /backup/ < seznam.txt
    desc:
      cs: Spustit příkaz pro každý řádek vstupu
      en: Run command for each input line
  - cmd: find . -name '*.log' | xargs rm
    desc:
      cs: Smazat všechny .log soubory
      en: Delete all .log files
  - cmd: watch -n 2 'df -h'
    desc:
      cs: Spouštět příkaz každé 2 vteřiny
      en: Run command every 2 seconds
  - cmd: time prikaz
    desc:
      cs: Změřit, jak dlouho příkaz trval
      en: Measure how long command took
  - cmd: sleep 5 && echo 'hotovo'
    desc:
      cs: Počkat 5 vteřin a něco udělat
      en: Wait 5 seconds and do something
  - cmd: yes | sudo apt remove balicek
    desc:
      cs: Automaticky odpovídat 'y' na otázky
      en: Automatically answer 'y' to prompts
  - cmd: command -v git
    desc:
      cs: Je tento příkaz nainstalovaný?
      en: Is this command installed?
  - cmd: type ls
    desc:
      cs: Co je za 'ls' (alias/binární/funkce)?
      en: What is 'ls' (alias/binary/function)?
