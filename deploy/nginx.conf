# linuxcmd reverse proxy.
# This file is included from within nginx's http{} block (sites-enabled/*),
# so the limit_req_zone directive below is valid here.
#
# NOTE: This serves plain HTTP on port 80. For any public deployment put it
# behind TLS (Let's Encrypt / Cloudflare Tunnel / reverse proxy) and uncomment
# the Strict-Transport-Security header below.

limit_req_zone $binary_remote_addr zone=linuxcmd_limit:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    access_log /var/log/nginx/linuxcmd.access.log;
    error_log  /var/log/nginx/linuxcmd.error.log;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;
    # Enable only when served over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=linuxcmd_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
